<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Regelwerk – Ja / Nein Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #18243a 0%, #0b1018 45%, #06090e 100%);
    color: #fff;
    display: flex;
    justify-content: center;
    padding: 30px 15px;
}

.container {
    width: 100%;
    max-width: 950px;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 34px;
}

.header p {
    margin: 0;
    color: #9da8b8;
}

.progress-area {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 18px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
    color: #b8c2d0;
    font-size: 14px;
}

.progress {
    width: 100%;
    height: 8px;
    background: #202936;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #4d8dff;
    transition: width .3s ease;
}

.card {
    background: rgba(13, 19, 29, .94);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 70px rgba(0,0,0,.35);
}

.category {
    display: inline-block;
    background: rgba(77,141,255,.12);
    color: #72a6ff;
    border: 1px solid rgba(77,141,255,.25);
    padding: 7px 11px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 15px;
}

.question-number {
    color: #8e99a9;
    font-size: 14px;
    margin-bottom: 10px;
}

.question {
    font-size: 25px;
    line-height: 1.45;
    margin: 0 0 28px;
    font-weight: 600;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer-btn {
    border: 1px solid rgba(255,255,255,.1);
    background: #151d29;
    color: white;
    border-radius: 14px;
    padding: 18px;
    font-size: 17px;
    cursor: pointer;
    transition: .2s ease;
}

.answer-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    background: #1b2636;
    border-color: rgba(255,255,255,.2);
}

.answer-btn:disabled {
    cursor: default;
}

.answer-btn.yes {
    border-color: rgba(50,205,130,.3);
}

.answer-btn.no {
    border-color: rgba(255,75,85,.3);
}

.answer-btn.correct {
    background: rgba(35,180,105,.15);
    border-color: #28c77a;
}

.answer-btn.wrong {
    background: rgba(235,65,75,.15);
    border-color: #ed515b;
}

.result {
    display: none;
    margin-top: 22px;
    border-radius: 14px;
    padding: 18px;
    line-height: 1.55;
}

.result.correct {
    display: block;
    background: rgba(35,180,105,.1);
    border: 1px solid rgba(35,180,105,.35);
}

.result.wrong {
    display: block;
    background: rgba(235,65,75,.1);
    border: 1px solid rgba(235,65,75,.35);
}

.result-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.rule-box {
    margin-top: 12px;
    background: rgba(0,0,0,.2);
    padding: 13px;
    border-radius: 10px;
    color: #d8dee8;
}

.penalty {
    margin-top: 10px;
    color: #ffbd6b;
}

.next-btn,
.restart-btn {
    width: 100%;
    margin-top: 18px;
    border: 0;
    border-radius: 13px;
    padding: 16px;
    background: #4d8dff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.next-btn:hover,
.restart-btn:hover {
    background: #397ce8;
}

.final {
    display: none;
    text-align: center;
}

.final h2 {
    font-size: 32px;
    margin-top: 0;
}

.score {
    font-size: 48px;
    font-weight: bold;
    margin: 20px 0;
}

.final-info {
    color: #aab4c2;
    line-height: 1.7;
}

.small {
    color: #7f8997;
    font-size: 13px;
    margin-top: 20px;
}

@media(max-width: 650px) {
    body {
        padding: 15px 10px;
    }

    .card {
        padding: 20px;
    }

    .question {
        font-size: 21px;
    }

    .answers {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Regelwerk – Ja / Nein Test</h1>
        <p>Beantworte die Fragen anhand des Regelwerks.</p>
    </div>

    <div class="progress-area">
        <div class="progress-top">
            <span id="progressText">Frage 1</span>
            <span id="scoreText">0 Punkte</span>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div class="card" id="quizCard">

        <div class="category" id="category"></div>

        <div class="question-number" id="questionNumber"></div>

        <div class="question" id="question"></div>

        <div class="answers">

            <button
                class="answer-btn yes"
                id="yesBtn"
                onclick="answer(true)">
                🟢 Ja
            </button>

            <button
                class="answer-btn no"
                id="noBtn"
                onclick="answer(false)">
                🔴 Nein
            </button>

        </div>

        <div id="result" class="result"></div>

        <button
            id="nextBtn"
            class="next-btn"
            style="display:none;"
            onclick="nextQuestion()">
            Nächste Frage
        </button>

    </div>

    <div class="card final" id="finalCard">

        <h2>Test abgeschlossen</h2>

        <div class="score" id="finalScore"></div>

        <div class="final-info" id="finalInfo"></div>

        <button class="restart-btn" onclick="restartQuiz()">
            🔄 Neuen Test starten
        </button>

    </div>

</div>

/*
==========================================================
QUIZ-SYSTEM
==========================================================
*/

let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;


/*
----------------------------------------------------------
Fisher-Yates Shuffle
----------------------------------------------------------
*/

function shuffle(array) {

    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}


/*
----------------------------------------------------------
Quiz starten
----------------------------------------------------------
*/

function startQuiz() {

    score = 0;
    currentQuestion = 0;
    answered = false;

    /*
     * Alle Fragen werden jedes Mal neu gemischt.
     */
    questions = shuffle(rules);

    document.getElementById("quizCard").style.display = "block";
    document.getElementById("finalCard").style.display = "none";

    showQuestion();
}


/*
----------------------------------------------------------
Frage anzeigen
----------------------------------------------------------
*/

function showQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("category").textContent =
        q.category;

    document.getElementById("questionNumber").textContent =
        "Regelwerk-Frage " +
        (currentQuestion + 1) +
        " von " +
        questions.length;

    document.getElementById("question").textContent =
        q.question;

    document.getElementById("progressText").textContent =
        "Frage " +
        (currentQuestion + 1) +
        " / " +
        questions.length;

    document.getElementById("scoreText").textContent =
        score +
        " Punkte";

    const percentage =
        (currentQuestion / questions.length) * 100;

    document.getElementById("progressBar").style.width =
        percentage + "%";

    const yesBtn =
        document.getElementById("yesBtn");

    const noBtn =
        document.getElementById("noBtn");

    yesBtn.disabled = false;
    noBtn.disabled = false;

    yesBtn.classList.remove("correct", "wrong");
    noBtn.classList.remove("correct", "wrong");

    document.getElementById("result").className =
        "result";

    document.getElementById("result").innerHTML =
        "";

    document.getElementById("nextBtn").style.display =
        "none";
}


/*
----------------------------------------------------------
Antwort prüfen
----------------------------------------------------------
*/

function answer(selectedAnswer) {

    if (answered) {
        return;
    }

    answered = true;

    const q = questions[currentQuestion];

    const correct =
        selectedAnswer === q.answer;

    const yesBtn =
        document.getElementById("yesBtn");

    const noBtn =
        document.getElementById("noBtn");

    yesBtn.disabled = true;
    noBtn.disabled = true;

    /*
     * Richtige Antwort markieren.
     */

    if (q.answer === true) {
        yesBtn.classList.add("correct");

        if (!correct) {
            noBtn.classList.add("wrong");
        }

    } else {

        noBtn.classList.add("correct");

        if (!correct) {
            yesBtn.classList.add("wrong");
        }
    }

    if (correct) {

        score++;

        document.getElementById("scoreText").textContent =
            score + " Punkte";
    }

    showResult(correct, q);

    document.getElementById("nextBtn").style.display =
        "block";
}


/*
----------------------------------------------------------
Ergebnis nach Frage
----------------------------------------------------------
*/

function showResult(correct, q) {

    const result =
        document.getElementById("result");

    result.className =
        correct
            ? "result correct"
            : "result wrong";

    const answerText =
        q.answer
            ? "🟢 Ja"
            : "🔴 Nein";

    result.innerHTML = `

        <div class="result-title">
            ${correct ? "✅ Richtig!" : "❌ Falsch!"}
        </div>

        <div>
            Richtige Antwort:
            <strong>${answerText}</strong>
        </div>

        <div class="rule-box">

            <strong>
                📖 Regel ${escapeHTML(q.number)}
            </strong>

            <br><br>

            ${escapeHTML(q.rule)}

        </div>

        <div class="penalty">

            ⚠️ <strong>Strafe bei Regelbruch:</strong><br>

            ${escapeHTML(q.penalty)}

        </div>
    `;
}


/*
----------------------------------------------------------
Nächste Frage
----------------------------------------------------------
*/

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        showFinal();

        return;
    }

    showQuestion();
}


/*
----------------------------------------------------------
Endergebnis
----------------------------------------------------------
*/

function showFinal() {

    document.getElementById("quizCard").style.display =
        "none";

    document.getElementById("finalCard").style.display =
        "block";

    const total =
        questions.length;

    const percentage =
        Math.round((score / total) * 100);

    document.getElementById("progressBar").style.width =
        "100%";

    document.getElementById("finalScore").textContent =
        score + " / " + total;

    document.getElementById("finalInfo").innerHTML = `

        Du hast <strong>${score}</strong> von
        <strong>${total}</strong> Fragen richtig beantwortet.

        <br><br>

        Ergebnis:
        <strong>${percentage}%</strong>

        <br><br>

        Die Fragen werden beim nächsten Durchlauf
        erneut zufällig gemischt.

    `;
}


/*
----------------------------------------------------------
Neuen Test starten
----------------------------------------------------------
*/

function restartQuiz() {

    startQuiz();

}


/*
----------------------------------------------------------
HTML-Sicherheit
----------------------------------------------------------
*/

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/*
==========================================================
START
==========================================================
*/

startQuiz();

</script>
