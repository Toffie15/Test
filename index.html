<script>

/* =========================================
   SUPABASE KONFIGURATION
========================================= */

/*
    HIER DEINE DATEN EINTRAGEN.

    Supabase:
    Project Settings
    → API
    → Project URL
    → Publishable/Anon Key
*/

const SUPABASE_URL =
    "https://axttwxfmpiqedhmssmkc.supabase.co/rest/v1/";

const SUPABASE_ANON_KEY =
    "sb_publishable_R-ET-Qjp5dsYFPH5qQvwFg_McVuc7ID";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================
   DATEN
========================================= */

let active = null;

let entries = [];

let selectedMonth = new Date();

selectedMonth.setDate(1);


/* =========================================
   LOGIN
========================================= */

async function login(){

    const email =
        document
            .getElementById("loginUser")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const errorBox =
        document.getElementById("loginError");

    const button =
        document.getElementById("loginButton");


    errorBox.textContent = "";


    if(!email || !password){

        errorBox.textContent =
            "E-Mail und Passwort eingeben.";

        return;
    }


    button.disabled = true;

    button.textContent =
        "Anmelden...";


    const {
        error
    } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    button.disabled = false;

    button.textContent =
        "Anmelden";


    if(error){

        console.error(error);

        errorBox.textContent =
            "E-Mail oder Passwort falsch.";

        return;
    }


    await startApp();

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

    await supabaseClient.auth.signOut();

    entries = [];

    active = null;

    document.body
        .classList
        .remove("authenticated");

    document
        .getElementById("loginPassword")
        .value = "";

    document
        .getElementById("loginError")
        .textContent = "";

}


/* =========================================
   AKTUELLER BENUTZER
========================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getUser();


    if(error){

        console.error(error);

        return null;

    }


    return data.user || null;

}


/* =========================================
   APP STARTEN
========================================= */

async function startApp(){

    const user =
        await getCurrentUser();


    if(!user){

        return;

    }


    document.body
        .classList
        .add("authenticated");


    document
        .getElementById("userInfo")
        .textContent =
        "👤 " +
        (user.email || "Benutzer");


    await loadData();

    renderMonth();

}


/* =========================================
   AUTH STATUS ÜBERWACHEN
========================================= */

supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

        if(event === "SIGNED_IN" && session){

            await startApp();

        }

        if(event === "SIGNED_OUT"){

            document.body
                .classList
                .remove("authenticated");

        }

    }
);


/* =========================================
   DATEN LADEN
========================================= */

async function loadData(){

    const user =
        await getCurrentUser();


    if(!user){

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient

            .from("time_entries")

            .select(
                "id,user_id,start_at,end_at,note,created_at"
            )

            .eq(
                "user_id",
                user.id
            )

            .order(
                "start_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(error);

        alert(
            "Fehler beim Laden der Zeiteinträge."
        );

        return;

    }


    entries =
        data || [];


    active =
        entries.find(
            entry => !entry.end_at
        ) || null;


    render();

    renderMonth();

}


/* =========================================
   EINSTEMPELN / AUSSTEMPELN
========================================= */

async function punch(){

    const user =
        await getCurrentUser();


    if(!user){

        alert(
            "Bitte zuerst anmelden."
        );

        return;

    }


    const button =
        document.getElementById(
            "punchButton"
        );


    button.disabled = true;


    try{

        const note =
            document
                .getElementById("note")
                .value
                .trim();


        /* ================================
           AUSSTEMPELN
        ================================= */

        if(active){

            const {
                error
            } =
                await supabaseClient

                    .from("time_entries")

                    .update({

                        end_at:
                            new Date()
                            .toISOString(),

                        note:
                            note

                    })

                    .eq(
                        "id",
                        active.id
                    )

                    .eq(
                        "user_id",
                        user.id
                    );


            if(error){

                console.error(error);

                alert(
                    "Fehler beim Ausstempeln."
                );

                return;

            }


            active = null;

        }


        /* ================================
           EINSTEMPELN
        ================================= */

        else{

            const {
                data,
                error
            } =
                await supabaseClient

                    .from("time_entries")

                    .insert({

                        user_id:
                            user.id,

                        start_at:
                            new Date()
                            .toISOString(),

                        end_at:
                            null,

                        note:
                            note

                    })

                    .select()

                    .single();


            if(error){

                console.error(error);

                alert(
                    "Fehler beim Einstempeln."
                );

                return;

            }


            active = data;

        }


        document
            .getElementById("note")
            .value = "";


        await loadData();


    }

    finally{

        button.disabled = false;

    }

}


/* =========================================
   ANZEIGE
========================================= */

function render(){

    const status =
        document.getElementById(
            "status"
        );


    const button =
        document.getElementById(
            "punchButton"
        );


    const since =
        document.getElementById(
            "since"
        );


    if(active){

        status.textContent =
            "🟢 Eingestempelt";


        button.textContent =
            "Ausstempeln";


        button.className =
            "punch red";


        since.textContent =
            "Seit " +
            formatTime(
                active.start_at
            ) +
            " Uhr";


        updateTimer();

    }

    else{

        status.textContent =
            "🔴 Ausgestempelt";


        button.textContent =
            "Einstempeln";


        button.className =
            "punch";


        document
            .getElementById("timer")
            .textContent =
            "00:00:00";


        since.textContent = "";

    }


    renderTable();

    updateStats();

}


/* =========================================
   TABELLE
========================================= */

function renderTable(){

    const log =
        document.getElementById(
            "log"
        );


    log.innerHTML = "";


    const sorted =
        [...entries]
            .filter(
                entry =>
                    entry.end_at
            )
            .sort(
                (a,b) =>
                    new Date(b.start_at) -
                    new Date(a.start_at)
            );


    sorted.forEach(
        entry => {

            const row =
                document.createElement(
                    "tr"
                );


            const start =
                new Date(
                    entry.start_at
                );


            const end =
                new Date(
                    entry.end_at
                );


            row.innerHTML = `

                <td>
                    ${formatDate(start)}
                </td>

                <td>
                    ${formatTime(start)}
                </td>

                <td>
                    ${formatTime(end)}
                </td>

                <td>
                    ${duration(
                        end - start
                    )}
                </td>

                <td class="note">
                    ${escapeHTML(
                        entry.note || "-"
                    )}
                </td>

            `;


            log.appendChild(row);

        }
    );


    document
        .getElementById("empty")
        .style.display =
        sorted.length
            ? "none"
            : "block";


    document
        .getElementById("entryCount")
        .textContent =
        sorted.length;

}


/* =========================================
   LIVE TIMER
========================================= */

function updateTimer(){

    if(!active){

        return;

    }


    const start =
        new Date(
            active.start_at
        );


    const ms =
        Date.now() -
        start.getTime();


    const totalSeconds =
        Math.max(
            0,
            Math.floor(
                ms / 1000
            )
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    document
        .getElementById("timer")
        .textContent =

        String(hours)
            .padStart(2,"0")

        + ":"

        + String(minutes)
            .padStart(2,"0")

        + ":"

        + String(seconds)
            .padStart(2,"0");

}


/* =========================================
   STATISTIK
========================================= */

function updateStats(){

    let today = 0;

    let week = 0;


    const now =
        new Date();


    const startToday =
        new Date(now);

    startToday.setHours(
        0,
        0,
        0,
        0
    );


    const startWeek =
        new Date(
            startToday
        );


    const day =
        (
            startWeek.getDay() + 6
        ) % 7;


    startWeek.setDate(
        startWeek.getDate() - day
    );


    entries.forEach(
        entry => {

            const start =
                new Date(
                    entry.start_at
                );


            const end =
                entry.end_at
                    ? new Date(
                        entry.end_at
                    )
                    : new Date();


            const time =
                Math.max(
                    0,
                    end - start
                );


            if(
                start >=
                startToday
            ){

                today += time;

            }


            if(
                start >=
                startWeek
            ){

                week += time;

            }

        }
    );


    document
        .getElementById("today")
        .textContent =
        duration(today);


    document
        .getElementById("week")
        .textContent =
        duration(week);

}


/* =========================================
   ZEIT FORMATIEREN
========================================= */

function formatTime(date){

    return new Date(date)
        .toLocaleTimeString(
            "de-DE",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


/* =========================================
   DATUM FORMATIEREN
========================================= */

function formatDate(date){

    return new Date(date)
        .toLocaleDateString(
            "de-DE"
        );

}


/* =========================================
   DAUER
========================================= */

function duration(ms){

    const minutes =
        Math.floor(
            Math.max(0,ms) / 60000
        );


    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    return (
        hours +
        "h " +
        String(mins)
            .padStart(2,"0") +
        "m"
    );

}


/* =========================================
   CSV EXPORT
========================================= */

function exportCSV(){

    const completed =
        entries.filter(
            entry =>
                entry.end_at
        );


    if(!completed.length){

        alert(
            "Keine Zeiteinträge vorhanden."
        );

        return;

    }


    const rows = [

        [
            "Datum",
            "Start",
            "Ende",
            "Dauer",
            "Notiz"
        ]

    ];


    const sorted =
        [...completed]
            .sort(
                (a,b) =>
                    new Date(a.start_at) -
                    new Date(b.start_at)
            );


    sorted.forEach(
        entry => {

            const start =
                new Date(
                    entry.start_at
                );


            const end =
                new Date(
                    entry.end_at
                );


            rows.push([

                formatDate(start),

                formatTime(start),

                formatTime(end),

                duration(
                    end - start
                ),

                entry.note || ""

            ]);

        }
    );


    const csv =

        "\uFEFF" +

        rows
            .map(
                row =>

                    row
                        .map(
                            value =>

                                '"' +
                                String(value)
                                    .replace(
                                        /"/g,
                                        '""'
                                    ) +
                                '"'
                        )
                        .join(";")
            )
            .join("\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;


    link.download =
        "stempeluhr_" +
        new Date()
            .toISOString()
            .slice(0,10) +
        ".csv";


    document
        .body
        .appendChild(link);


    link.click();

    link.remove();


    URL.revokeObjectURL(
        url
    );

}

/* =========================================
   MONATSÜBERSICHT
========================================= */

function changeMonth(delta){

    selectedMonth.setMonth(
        selectedMonth.getMonth() +
        delta
    );


    renderMonth();

}


function renderMonth(){

    const label =
        document.getElementById(
            "monthLabel"
        );


    const summary =
        document.getElementById(
            "monthSummary"
        );


    if(!label || !summary){

        return;

    }


    label.textContent =
        selectedMonth
            .toLocaleDateString(
                "de-DE",
                {
                    month:"long",
                    year:"numeric"
                }
            );


    const year =
        selectedMonth.getFullYear();


    const month =
        selectedMonth.getMonth();


    const monthly =
        entries.filter(
            entry => {

                const date =
                    new Date(
                        entry.start_at
                    );


                return (
                    date.getFullYear() === year &&
                    date.getMonth() === month &&
                    entry.end_at
                );

            }
        );


    const total =
        monthly.reduce(
            (sum,entry) => {

                const start =
                    new Date(
                        entry.start_at
                    );


                const end =
                    new Date(
                        entry.end_at
                    );


                return sum +
                    Math.max(
                        0,
                        end - start
                    );

            },
            0
        );


    const days = {};


    monthly.forEach(
        entry => {

            const date =
                new Date(
                    entry.start_at
                );


            const key =
                date.toLocaleDateString(
                    "de-DE"
                );


            const time =
                Math.max(
                    0,
                    new Date(
                        entry.end_at
                    ) -
                    date
                );


            days[key] =
                (
                    days[key] || 0
                ) + time;

        }
    );


    const rows =
        Object.entries(days)

            .sort(
                (a,b) => {

                    const [da,ma,ya] =
                        a[0].split(".");

                    const [db,mb,yb] =
                        b[0].split(".");


                    return new Date(
                        ya,
                        ma - 1,
                        da
                    ) -

                    new Date(
                        yb,
                        mb - 1,
                        db
                    );

                }
            )

            .map(
                ([day,time]) =>

                    `<div class="month-day">
                        <span>
                            ${escapeHTML(day)}
                        </span>

                        <b>
                            ${duration(time)}
                        </b>
                    </div>`
            )

            .join("");


    summary.innerHTML =

        `<div style="
            font-size:23px;
            font-family:monospace;
            margin-bottom:10px;
        ">
            ${duration(total)}
        </div>` +

        (
            rows ||
            `<div class="sub">
                Keine Einträge in diesem Monat.
            </div>`
        );

}
