<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b1d21">
<title>Stempeluhr</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#1b1d21;color:#f0ede6;
 font-family:Arial,sans-serif;padding:20px;
}
main{max-width:650px;margin:auto}
.card{
 background:#232629;border:1px solid #383c40;
 border-radius:8px;padding:22px;margin-bottom:15px
}
h1,h2{margin-top:0}
input,button{
 width:100%;padding:12px;margin:6px 0;
 border-radius:5px;border:1px solid #383c40;
 font-size:15px
}
input{background:#2b2f33;color:white}
button{background:#cf9a3f;color:#1b1d21;border:0;font-weight:bold;cursor:pointer}
button.red{background:#c1685f}
button.gray{background:#383c40;color:white}
.hidden{display:none}
.time{text-align:center;font-size:52px;font-family:monospace;margin:20px 0}
.status{text-align:center;color:#9a9d9f;margin-bottom:10px}
.stats{display:flex;gap:10px}
.stat{flex:1;background:#2b2f33;padding:15px;border-radius:5px}
.stat small{color:#9a9d9f}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{padding:9px;border-bottom:1px solid #383c40;text-align:left}
th{color:#9a9d9f;font-size:12px}
@media(max-width:600px){
 body{padding:10px}
 .card{padding:16px}
 .time{font-size:42px}
 .stats{gap:6px}
 .stat{padding:10px;font-size:14px}
 table{font-size:13px}
}
</style>
</head>

<body>
<main>

<!-- LOGIN -->
<section id="login" class="card">
<h1>Stempeluhr</h1>
<p>Anmelden</p>
<input id="user" placeholder="Benutzername">
<input id="pass" type="password" placeholder="Passwort">
<button onclick="login()">Einloggen</button>
<p id="error"></p>
</section>

<!-- APP -->
<section id="app" class="hidden">

<div class="card">
<h1>Stempeluhr</h1>
<div id="who"></div>
<button class="gray" onclick="logout()">Abmelden</button>
</div>

<!-- ADMIN -->
<div id="admin" class="card hidden">
<h2>Verwaltung</h2>

<input id="newUser" placeholder="Benutzername">
<input id="newPass" type="password" placeholder="Passwort">

<label>
<input id="newAdmin" type="checkbox" style="width:auto">
 Admin-Rechte
</label>

<button onclick="createUser()">Konto erstellen</button>
<div id="users"></div>
</div>

<!-- CLOCK -->
<div class="card">
<div class="status" id="status">Ausgestempelt</div>

<div class="time" id="time">00:00:00</div>

<input id="note" placeholder="Notiz (optional)">

<button id="punch" onclick="punch()">Einstempeln</button>
</div>

<!-- STATS -->
<div class="stats">
<div class="stat">
<small>HEUTE</small>
<br><b id="today">0h 00m</b>
</div>

<div class="stat">
<small>DIESE WOCHE</small>
<br><b id="week">0h 00m</b>
</div>
</div>

<!-- LOG -->
<div class="card">
<h2>Zeiterfassung</h2>

<table>
<thead>
<tr>
<th>Start</th>
<th>Ende</th>
<th>Dauer</th>
<th>Notiz</th>
</tr>
</thead>

<tbody id="log"></tbody>
</table>

<button class="red" onclick="clearAll()">Alle Einträge löschen</button>
</div>

</section>
</main>

<script>
let current=null;
let active=null;
let entries=[];

const $=id=>document.getElementById(id);

async function hash(p){
 const b=await crypto.subtle.digest(
  "SHA-256",
  new TextEncoder().encode(p)
 );
 return [...new Uint8Array(b)]
  .map(x=>x.toString(16).padStart(2,"0")).join("");
}

function key(x){
 return x+":"+current;
}

async function login(){
 const u=$("user").value.trim().toLowerCase();
 const p=$("pass").value;

 if(!u||!p){
  $("error").textContent="Bitte Daten eingeben.";
  return;
 }

 const data=localStorage.getItem("user:"+u);

 if(!data){
  $("error").textContent="Benutzername oder Passwort falsch.";
  return;
 }

 const d=JSON.parse(data);

 if(await hash(p)!==d.hash){
  $("error").textContent="Benutzername oder Passwort falsch.";
  return;
 }

 current=u;
 $("login").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("who").textContent="@"+u+(d.admin?" • ADMIN":"");

 if(d.admin){
  $("admin").classList.remove("hidden");
  showUsers();
 }

 load();
}

async function setup(){
 if(localStorage.getItem("system"))return;

 const u=prompt("Admin-Benutzername:");
 const p=prompt("Admin-Passwort:");

 if(!u||!p)return;

 localStorage.setItem(
  "user:"+u.toLowerCase(),
  JSON.stringify({
   hash:await hash(p),
   admin:true
  })
 );

 localStorage.setItem("system",u.toLowerCase());
}

async function createUser(){
 const u=$("newUser").value.trim().toLowerCase();
 const p=$("newPass").value;

 if(!u||p.length<6){
  alert("Benutzername eingeben und Passwort mindestens 6 Zeichen.");
  return;
 }

 if(localStorage.getItem("user:"+u)){
  alert("Benutzer existiert bereits.");
  return;
 }

 localStorage.setItem(
  "user:"+u,
  JSON.stringify({
   hash:await hash(p),
   admin:$("newAdmin").checked
  })
 );

 $("newUser").value="";
 $("newPass").value="";
 $("newAdmin").checked=false;

 showUsers();
}

function showUsers(){
 $("users").innerHTML="";

 Object.keys(localStorage)
 .filter(x=>x.startsWith("user:"))
 .forEach(k=>{
  const u=k.substring(5);
  const d=JSON.parse(localStorage.getItem(k));

  const div=document.createElement("div");
  div.style.marginTop="10px";

  div.innerHTML=
   "@"+u+(d.admin?" • ADMIN":"")+
   (u!==current?
    ` <button class="red" onclick="deleteUser('${u}')">Löschen</button>`:"");

  $("users").appendChild(div);
 });
}

function deleteUser(u){
 if(!confirm("Benutzer wirklich löschen?"))return;

 localStorage.removeItem("user:"+u);
 localStorage.removeItem("entries:"+u);
 localStorage.removeItem("active:"+u);

 showUsers();
}

function load(){
 entries=JSON.parse(
  localStorage.getItem(key("entries"))||"[]"
 );

 active=JSON.parse(
  localStorage.getItem(key("active"))||"null"
 );

 render();
}

function save(){
 localStorage.setItem(key("entries"),JSON.stringify(entries));

 if(active)
  localStorage.setItem(key("active"),JSON.stringify(active));
 else
  localStorage.removeItem(key("active"));
}

function punch(){
 if(active){
  entries.push({
   start:active.start,
   end:Date.now(),
   note:$("note").value
  });

  active=null;
 }else{
  active={
   start:Date.now(),
   note:$("note").value
  };
 }

 save();
 render();
}

function render(){
 if(active){
  $("status").textContent="🟢 Eingestempelt";
  $("punch").textContent="Ausstempeln";
  $("punch").className="red";
  $("note").value=active.note||"";
 }else{
  $("status").textContent="🔴 Ausgestempelt";
  $("punch").textContent="Einstempeln";
  $("punch").className="";
  $("time").textContent="00:00:00";
 }

 $("log").innerHTML="";

 [...entries].reverse().forEach((e,i)=>{
  const tr=document.createElement("tr");

  tr.innerHTML=`
   <td>${time(e.start)}</td>
   <td>${time(e.end)}</td>
   <td>${duration(e.end-e.start)}</td>
   <td>${e.note||"-"}</td>
  `;

  $("log").appendChild(tr);
 });

 updateStats();
}

function time(t){
 return new Date(t).toLocaleTimeString("de-DE",{
  hour:"2-digit",
  minute:"2-digit"
 });
}

function duration(ms){
 const m=Math.floor(ms/60000);
 return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";
}

function updateStats(){
 let today=0;
 let week=0;

 const now=new Date();
 const start=new Date(now);
 start.setHours(0,0,0,0);

 const monday=new Date(start);
 const day=(monday.getDay()+6)%7;
 monday.setDate(monday.getDate()-day);

 entries.forEach(e=>{
  const d=e.end-e.start;

  if(e.start>=start)today+=d;
  if(e.start>=monday)week+=d;
 });

 if(active){
  const d=Date.now()-active.start;

  if(active.start>=start)today+=d;
  if(active.start>=monday)week+=d;
 }

 $("today").textContent=duration(today);
 $("week").textContent=duration(week);
}

function logout(){
 current=null;
 active=null;
 entries=[];

 $("app").classList.add("hidden");
 $("login").classList.remove("hidden");
 $("user").value="";
 $("pass").value="";
}

function clearAll(){
 if(!confirm("Alle Einträge löschen?"))return;

 entries=[];
 save();
 render();
}

setInterval(()=>{
 if(active){
  $("time").textContent=
   new Date(Date.now()-active.start)
   .toISOString().substr(11,8);

  updateStats();
 }
},1000);

(async()=>{
 await setup();

 if(localStorage.getItem("system"))
  $("error").textContent="Admin-Konto vorhanden. Bitte anmelden.";
})();
</script>

</body>
</html>
