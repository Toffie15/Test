<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0f14">
<title>Stempeluhr</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#241b3d 0,#0d0f14 45%);
    color:#f5f5f7;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
}

.hidden{
    display:none!important;
}

.card{
    background:#171a21;
    border:1px solid #2b303b;
    border-radius:18px;
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 12px 35px rgba(0,0,0,.35);
}

.logo{
    width:48px;
    height:48px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#8b5cf6,#5b21b6);
    font-size:24px;
    margin-bottom:15px;
}

h1{
    margin:0;
    font-size:24px;
}

h2{
    margin:0 0 15px;
    font-size:17px;
}

.sub{
    color:#8f98a8;
    font-size:13px;
}

input{
    width:100%;
    padding:13px;
    margin:6px 0;
    border-radius:11px;
    border:1px solid #303641;
    background:#22262e;
    color:white;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#8b5cf6;
}

button{
    border:0;
    border-radius:11px;
    padding:12px 16px;
    margin:5px 0;
    background:#8b5cf6;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.1);
}

button.gray{
    background:#303641;
}

button.red{
    background:#9d3838;
}

.login{
    max-width:420px;
    margin:70px auto;
}

.login .logo{
    margin-left:auto;
    margin-right:auto;
}

.login h1,
.login .sub{
    text-align:center;
}

.error{
    color:#ef6666;
    min-height:20px;
    font-size:13px;
}

.test{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#20242c;
    color:#9da5b2;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.user{
    color:#9da5b2;
    margin-right:7px;
}

.clock{
    text-align:center;
    padding:35px 20px;
}

.status{
    color:#9da5b2;
    margin-bottom:12px;
}

.time{
    font-size:70px;
    font-family:monospace;
    letter-spacing:-3px;
    margin:20px 0 10px;
}

.since{
    min-height:20px;
    color:#8f98a8;
}

.punch{
    width:280px;
    padding:16px;
    font-size:16px;
    margin-top:18px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:16px;
}

.stat{
    background:#171a21;
    border:1px solid #2b303b;
    border-radius:14px;
    padding:17px;
}

.stat span{
    color:#8f98a8;
    font-size:11px;
    text-transform:uppercase;
}

.stat b{
    display:block;
    font-size:23px;
    font-family:monospace;
    margin-top:7px;
}

.row{
    display:flex;
    gap:10px;
}

.row>*{
    flex:1;
}

.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.table{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:650px;
    border-collapse:collapse;
}

th,
td{
    padding:12px 10px;
    text-align:left;
    border-bottom:1px solid #2c313b;
}

th{
    color:#8f98a8;
    font-size:11px;
    text-transform:uppercase;
}

td{
    font-family:monospace;
}

td.note{
    font-family:Arial,sans-serif;
    color:#aab1bd;
}

.admin-user{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #2c313b;
}

hr{
    border:0;
    border-top:1px solid #2c313b;
    margin:18px 0;
}

@media(max-width:650px){

    body{
        padding:10px;
    }

    .card{
        padding:16px;
        border-radius:14px;
    }

    .login{
        margin:30px auto;
    }

    .header{
        align-items:flex-start;
    }

    .header .user{
        display:block;
        margin-bottom:5px;
    }

    .time{
        font-size:43px;
        letter-spacing:-2px;
    }

    .punch{
        width:100%;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .stats .stat:last-child{
        grid-column:1/-1;
    }

    .row{
        flex-direction:column;
    }

    .actions button{
        flex:1;
    }

    table{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="container">


<!-- ================= LOGIN ================= -->

<section id="loginPage" class="card login">

<div class="logo">
⏱️
</div>

<h1>Stempeluhr</h1>

<p class="sub">
Arbeitszeit einfach und übersichtlich erfassen
</p>

<br>

<input
    id="username"
    type="text"
    placeholder="Benutzername"
    autocomplete="username"
>

<input
    id="password"
    type="password"
    placeholder="Passwort"
    autocomplete="current-password"
>

<button
    onclick="login()"
    style="width:100%;"
>
Einloggen
</button>

<div
    id="loginError"
    class="error"
></div>

<div class="test">

<b>Test-Account</b><br><br>

Benutzername:
<b>test</b><br>

Passwort:
<b>test1234</b>

</div>

</section>


<!-- ================= APP ================= -->

<section id="appPage" class="hidden">


<!-- HEADER -->

<div class="header">

<div>

<h1>⏱️ Stempeluhr</h1>

<div
    id="currentDate"
    class="sub"
>
</div>

</div>

<div>

<span
    id="currentUser"
    class="user"
>
</span>

<button
    class="gray"
    onclick="logout()"
>
Abmelden
</button>

</div>

</div>


<!-- ================= ADMIN ================= -->

<section
    id="adminPanel"
    class="card hidden"
>

<h2>
Benutzerverwaltung
</h2>

<div class="row">

<input
    id="newUsername"
    placeholder="Neuer Benutzer"
>

<input
    id="newPassword"
    type="password"
    placeholder="Passwort"
>

<button
    onclick="createUser()"
>
Erstellen
</button>

</div>

<div id="userList"></div>

</section>


<!-- ================= CLOCK ================= -->

<section
    id="clockCard"
    class="card clock"
>

<div
    id="status"
    class="status"
>
🔴 Ausgestempelt
</div>

<div
    id="timer"
    class="time"
>
00:00:00
</div>

<div
    id="since"
    class="since"
>
</div>

<input
    id="note"
    placeholder="Notiz, z. B. Büro oder Projekt"
>

<button
    id="punchButton"
    class="punch"
    onclick="punch()"
>
Einstempeln
</button>

</section>


<!-- ================= STATS ================= -->

<div class="stats">

<div class="stat">

<span>
Heute
</span>

<b id="today">
0h 00m
</b>

</div>


<div class="stat">

<span>
Diese Woche
</span>

<b id="week">
0h 00m
</b>

</div>


<div class="stat">

<span>
Einträge
</span>

<b id="entryCount">
0
</b>

</div>

</div>


<!-- ================= ZEITERFASSUNG ================= -->

<section class="card">

<div class="header">

<h2>
Zeiterfassung
</h2>

<div class="actions">

<button
    onclick="exportCSV()"
>
CSV Export
</button>

<button
    class="red"
    onclick="deleteAll()"
>
Löschen
</button>

</div>

</div>


<div class="table">

<table>

<thead>

<tr>

<th>
Datum
</th>

<th>
Start
</th>

<th>
Ende
</th>

<th>
Dauer
</th>

<th>
Notiz
</th>

</tr>

</thead>

<tbody id="log">
</tbody>

</table>

</div>


<p
    id="empty"
    class="sub"
    style="text-align:center;"
>
Noch keine Einträge.
</p>

</section>


</section>

</div>


<script>

/* =====================================================
   TEST-ACCOUNT
===================================================== */

const TEST_USER = "test";
const TEST_PASSWORD = "test1234";


/* =====================================================
   VARIABLEN
===================================================== */

let currentUser = null;
let active = null;
let entries = [];


/* =====================================================
   ELEMENT HELPER
===================================================== */

function $(id){
    return document.getElementById(id);
}


/* =====================================================
   BENUTZER INITIALISIEREN
===================================================== */

function setupUsers(){

    /*
       Test-Account wird bei jedem Start geprüft.
       Falls er fehlt, wird er automatisch erstellt.
    */

    const key = "user:" + TEST_USER;

    if(!localStorage.getItem(key)){

        localStorage.setItem(
            key,
            JSON.stringify({
                password:TEST_PASSWORD,
                admin:true
            })
        );

    }

}


/* =====================================================
   LOGIN
===================================================== */

function login(){

    const username =
        $("username")
        .value
        .trim()
        .toLowerCase();

    const password =
        $("password")
        .value;


    $("loginError").textContent = "";


    if(username === ""){

        $("loginError").textContent =
            "Bitte Benutzernamen eingeben.";

        return;

    }


    if(password === ""){

        $("loginError").textContent =
            "Bitte Passwort eingeben.";

        return;

    }


    const stored =
        localStorage.getItem(
            "user:" + username
        );


    if(!stored){

        $("loginError").textContent =
            "Benutzername oder Passwort falsch.";

        return;

    }


    let account;

    try{

        account =
            JSON.parse(stored);

    }catch(error){

        $("loginError").textContent =
            "Benutzerkonto konnte nicht gelesen werden.";

        return;

    }


    if(account.password !== password){

        $("loginError").textContent =
            "Benutzername oder Passwort falsch.";

        return;

    }


    /* LOGIN ERFOLGREICH */

    currentUser = username;


    $("loginPage")
        .classList
        .add("hidden");


    $("appPage")
        .classList
        .remove("hidden");


    $("currentUser").textContent =
        "@" +
        username +
        (account.admin ? " • ADMIN" : "");


    $("currentDate").textContent =
        new Date()
        .toLocaleDateString(
            "de-DE",
            {
                weekday:"long",
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        );


    if(account.admin){

        $("adminPanel")
            .classList
            .remove("hidden");

        showUsers();

    }


    loadData();

}


/* =====================================================
   DATEN LADEN
===================================================== */

function loadData(){

    const savedEntries =
        localStorage.getItem(
            "entries:" + currentUser
        );


    const savedActive =
        localStorage.getItem(
            "active:" + currentUser
        );


    try{

        entries =
            savedEntries
            ? JSON.parse(savedEntries)
            : [];

    }catch{

        entries = [];

    }


    try{

        active =
            savedActive
            ? JSON.parse(savedActive)
            : null;

    }catch{

        active = null;

    }


    render();

}


/* =====================================================
   DATEN SPEICHERN
===================================================== */

function saveData(){

    localStorage.setItem(

        "entries:" + currentUser,

        JSON.stringify(entries)

    );


    if(active){

        localStorage.setItem(

            "active:" + currentUser,

            JSON.stringify(active)

        );

    }else{

        localStorage.removeItem(

            "active:" + currentUser

        );

    }

}


/* =====================================================
   EINSTEMPELN / AUSSTEMPELN
===================================================== */

function punch(){

    if(active){

        /*
           AUSSTEMPELN
        */

        entries.push({

            start:active.start,

            end:Date.now(),

            note:$("note")
                .value
                .trim()

        });


        active = null;


        $("note").value = "";


    }else{

        /*
           EINSTEMPELN
        */

        active = {

            start:Date.now(),

            note:$("note")
                .value
                .trim()

        };

    }


    saveData();

    render();

}


/* =====================================================
   ANZEIGE AKTUALISIEREN
===================================================== */

function render(){

    if(active){

        $("status").textContent =
            "🟢 Eingestempelt";


        $("punchButton").textContent =
            "Ausstempeln";


        $("punchButton")
            .className =
            "punch red";


        $("since").textContent =
            "Seit " +
            formatTime(active.start) +
            " Uhr";


        updateTimer();


    }else{

        $("status").textContent =
            "🔴 Ausgestempelt";


        $("punchButton").textContent =
            "Einstempeln";


        $("punchButton")
            .className =
            "punch";


        $("timer").textContent =
            "00:00:00";


        $("since").textContent =
            "";

    }


    renderTable();

    updateStats();

}


/* =====================================================
   TABELLE
===================================================== */

function renderTable(){

    $("log").innerHTML = "";


    const sorted =
        [...entries]
        .sort(
            (a,b) =>
                b.start - a.start
        );


    sorted.forEach(entry=>{

        const row =
            document.createElement("tr");


        row.innerHTML = `

        <td>
            ${formatDate(entry.start)}
        </td>

        <td>
            ${formatTime(entry.start)}
        </td>

        <td>
            ${formatTime(entry.end)}
        </td>

        <td>
            ${duration(
                entry.end -
                entry.start
            )}
        </td>

        <td class="note">
            ${escapeHTML(
                entry.note || "-"
            )}
        </td>

        `;


        $("log")
            .appendChild(row);

    });


    $("empty").style.display =
        entries.length === 0
        ? "block"
        : "none";


    $("entryCount").textContent =
        entries.length;

}


/* =====================================================
   LIVE TIMER
===================================================== */

function updateTimer(){

    if(!active)
        return;


    const ms =
        Date.now() -
        active.start;


    const totalSeconds =
        Math.floor(
            ms / 1000
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    $("timer").textContent =

        String(hours)
        .padStart(2,"0")

        + ":"

        + String(minutes)
        .padStart(2,"0")

        + ":"

        + String(seconds)
        .padStart(2,"0");

}


/* =====================================================
   STATISTIK
===================================================== */

function updateStats(){

    let today = 0;
    let week = 0;


    const now =
        new Date();


    const startToday =
        new Date(now);

    startToday.setHours(
        0,0,0,0
    );


    const startWeek =
        new Date(startToday);


    const day =
        (startWeek.getDay()+6)%7;


    startWeek.setDate(
        startWeek.getDate() - day
    );


    entries.forEach(entry=>{

        const time =
            entry.end -
            entry.start;


        if(entry.start >= startToday){

            today += time;

        }


        if(entry.start >= startWeek){

            week += time;

        }

    });


    if(active){

        const time =
            Date.now() -
            active.start;


        if(active.start >= startToday){

            today += time;

        }


        if(active.start >= startWeek){

            week += time;

        }

    }


    $("today").textContent =
        duration(today);


    $("week").textContent =
        duration(week);

}


/* =====================================================
   ZEIT FORMAT
===================================================== */

function formatTime(timestamp){

    return new Date(timestamp)
        .toLocaleTimeString(
            "de-DE",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


/* =====================================================
   DATUM FORMAT
===================================================== */

function formatDate(timestamp){

    return new Date(timestamp)
        .toLocaleDateString(
            "de-DE"
        );

}


/* =====================================================
   DAUER FORMAT
===================================================== */

function duration(ms){

    const minutes =
        Math.floor(
            ms / 60000
        );


    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    return (
        hours +
        "h " +
        String(mins)
            .padStart(2,"0") +
        "m"
    );

}


/* =====================================================
   CSV EXPORT
===================================================== */

function exportCSV(){

    if(entries.length === 0){

        alert(
            "Keine Zeiteinträge vorhanden."
        );

        return;

    }


    const rows = [

        [
            "Datum",
            "Start",
            "Ende",
            "Dauer",
            "Notiz"
        ]

    ];


    const sorted =
        [...entries]
        .sort(
            (a,b) =>
                a.start - b.start
        );


    sorted.forEach(entry=>{

        rows.push([

            formatDate(
                entry.start
            ),

            formatTime(
                entry.start
            ),

            formatTime(
                entry.end
            ),

            duration(
                entry.end -
                entry.start
            ),

            entry.note || ""

        ]);

    });


    const csv =

        "\uFEFF" +

        rows
        .map(row=>

            row
            .map(value=>

                '"' +
                String(value)
                .replace(
                    /"/g,
                    '""'
                ) +
                '"'

            )
            .join(";")

        )
        .join("\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                "text/csv;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    link.download =
        "stempeluhr_" +
        currentUser +
        "_" +
        new Date()
        .toISOString()
        .slice(0,10) +
        ".csv";


    document.body
        .appendChild(link);


    link.click();


    link.remove();


    URL.revokeObjectURL(url);

}


/* =====================================================
   ALLE EINTRÄGE LÖSCHEN
===================================================== */

function deleteAll(){

    if(!confirm(
        "Wirklich alle Zeiteinträge löschen?"
    )){

        return;

    }


    entries = [];


    saveData();

    render();

}


/* =====================================================
   BENUTZER ERSTELLEN
===================================================== */

function createUser(){

    const username =
        $("newUsername")
        .value
        .trim()
        .toLowerCase();


    const password =
        $("newPassword")
        .value;


    if(!username){

        alert(
            "Bitte Benutzernamen eingeben."
        );

        return;

    }


    if(password.length < 6){

        alert(
            "Das Passwort muss mindestens 6 Zeichen haben."
        );

        return;

    }


    if(
        localStorage.getItem(
            "user:" + username
        )
    ){

        alert(
            "Dieser Benutzer existiert bereits."
        );

        return;

    }


    localStorage.setItem(

        "user:" + username,

        JSON.stringify({

            password:password,

            admin:false

        })

    );


    $("newUsername").value = "";

    $("newPassword").value = "";


    showUsers();

}


/* =====================================================
   BENUTZER ANZEIGEN
===================================================== */

function showUsers(){

    $("userList").innerHTML = "";


    Object.keys(localStorage)

    .filter(
        key =>
        key.startsWith("user:")
    )

    .forEach(key=>{

        const username =
            key.substring(5);


        let account;


        try{

            account =
                JSON.parse(
                    localStorage
                    .getItem(key)
                );

        }catch{

            return;

        }


        const div =
            document.createElement("div");


        div.className =
            "admin-user";


        const name =
            document.createElement("span");


        name.textContent =
            "@" +
            username +
            (
                account.admin
                ? " • ADMIN"
                : ""
            );


        div.appendChild(name);


        /*
           Aktuellen Benutzer
           nicht löschen.
        */

        if(username !== currentUser){

            const button =
                document.createElement("button");


            button.className =
                "red";


            button.textContent =
                "Löschen";


            button.onclick = function(){

                if(!confirm(
                    "Benutzer " +
                    username +
                    " wirklich löschen?"
                )){

                    return;

                }


                localStorage.removeItem(
                    "user:" +
                    username
                );


                localStorage.removeItem(
                    "entries:" +
                    username
                );


                localStorage.removeItem(
                    "active:" +
                    username
                );


                showUsers();

            };


            div.appendChild(button);

        }


        $("userList")
            .appendChild(div);

    });

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    currentUser = null;

    active = null;

    entries = [];


    $("appPage")
        .classList
        .add("hidden");


    $("loginPage")
        .classList
        .remove("hidden");


    $("username").value = "";

    $("password").value = "";

    $("loginError").textContent = "";

}


/* =====================================================
   HTML SICHER MACHEN
===================================================== */

function escapeHTML(text){

    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   TIMER AKTUALISIEREN
===================================================== */

setInterval(

    function(){

        if(active){

            updateTimer();

            updateStats();

        }

    },

    1000

);


/* =====================================================
   START
===================================================== */

setupUsers();

</script>

</body>
</html>
