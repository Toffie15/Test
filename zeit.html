<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stempeluhr</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#222}
body.dark{background:#181a1f;color:#eee}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#222;color:#fff}
main{max-width:900px;margin:20px auto;padding:0 15px}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
.dark .card{background:#24272d}
button,input{padding:10px;border-radius:8px;border:1px solid #ccc;font-size:14px}
button{cursor:pointer;background:#222;color:#fff;border:0}
button.red{background:#c33}button.green{background:#198754}
input{width:100%;margin:5px 0}
#clock{font-size:38px;text-align:center;font-weight:bold;margin:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center;padding:12px;background:#eee;border-radius:8px}
.dark .stat{background:#333}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.dark th,.dark td{border-color:#444}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
footer{text-align:center;color:#8f98a8;font-size:12px;padding:10px 0 5px}
@media(max-width:600px){.stats{grid-template-columns:1fr}table{font-size:12px}}
</style>
</head>

<body>
<header>
  <b>Stempeluhr</b>
  <button onclick="theme()">🌙</button>
</header>

<main>
  <div class="card">
    <div id="clock">00:00:00</div>
    <input id="note" placeholder="Notiz (optional)">
    <button id="punch" class="green" onclick="punch()">Einstempeln</button>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><b>Heute</b><br><span id="today">0:00</span></div>
      <div class="stat"><b>Woche</b><br><span id="week">0:00</span></div>
      <div class="stat"><b>Einträge</b><br><span id="count">0</span></div>
    </div>
  </div>

  <div class="card">
    <b>Monatsübersicht</b>
    <div class="actions">
      <button onclick="month(-1)">←</button>
      <span id="month"></span>
      <button onclick="month(1)">→</button>
    </div>
    <p>Arbeitszeit: <b id="monthTime">0:00</b></p>
  </div>

  <div class="card">
    <b>Zeiterfassung</b>
    <table>
      <thead>
        <tr><th>Datum</th><th>Start</th><th>Ende</th><th>Zeit</th><th>Notiz</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="actions">
      <button onclick="csv()">CSV Export</button>
      <button onclick="backup()">Backup</button>
      <button onclick="restore()">Import</button>
      <button class="red" onclick="clearAll()">Alles löschen</button>
    </div>
  </div>
</main>

<footer>Scripted by Luca Valentine</footer>

<script>
const $=id=>document.getElementById(id);
let entries=JSON.parse(localStorage.entries||"[]"),
    active=JSON.parse(localStorage.active||"null"),
    view=new Date();

const save=()=>{
  localStorage.entries=JSON.stringify(entries);
  localStorage.active=JSON.stringify(active);
};

const pad=n=>String(n).padStart(2,"0");
const time=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const date=d=>d.toISOString().slice(0,10);

const dur=(a,b)=>{
  let m=Math.max(0,(new Date(b)-new Date(a))/60000);
  return `${Math.floor(m/60)}:${pad(Math.floor(m%60))}`;
};

function punch(){
  if(active){
    entries.push({...active,end:new Date().toISOString()});
    active=null;
    $("punch").textContent="Einstempeln";
    $("punch").className="green";
  }else{
    active={start:new Date().toISOString(),note:$("note").value};
    $("note").value="";
    $("punch").textContent="Ausstempeln";
    $("punch").className="red";
  }
  save();render();
}

function render(){
  $("rows").innerHTML=entries.slice().reverse().map(e=>`
    <tr>
      <td>${e.start.slice(0,10)}</td>
      <td>${time(new Date(e.start))}</td>
      <td>${e.end?time(new Date(e.end)):"läuft"}</td>
      <td>${e.end?dur(e.start,e.end):dur(e.start,new Date())}</td>
      <td>${safe(e.note||"")}</td>
    </tr>`).join("");
  stats();
  renderMonth();
}

function stats(){
  let now=new Date(),today=date(now),week=new Date(now);
  week.setDate(now.getDate()-now.getDay()+1);

  let t=0,w=0;
  entries.forEach(e=>{
    let d=new Date(e.start),m=e.end?(new Date(e.end)-d)/60000:(Date.now()-d)/60000;
    if(date(d)==today)t+=m;
    if(d>=week)w+=m;
  });

  $("today").textContent=Math.floor(t/60)+":"+pad(Math.floor(t%60));
  $("week").textContent=Math.floor(w/60)+":"+pad(Math.floor(w%60));
  $("count").textContent=entries.length;
}

function renderMonth(){
  let y=view.getFullYear(),m=view.getMonth();
  $("month").textContent=view.toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  let total=0;
  entries.forEach(e=>{
    let d=new Date(e.start);
    if(d.getFullYear()==y&&d.getMonth()==m&&e.end)
      total+=(new Date(e.end)-d)/60000;
  });
  $("monthTime").textContent=Math.floor(total/60)+":"+pad(Math.floor(total%60));
}

function month(n){
  view.setMonth(view.getMonth()+n);
  renderMonth();
}

function csv(){
  let out="Datum;Start;Ende;Zeit;Notiz\n";
  entries.forEach(e=>{
    out+=`${e.start.slice(0,10)};${time(new Date(e.start))};${e.end?time(new Date(e.end)):""};${e.end?dur(e.start,e.end):""};"${(e.note||"").replaceAll('"','""')}"\n`;
  });
  download("stempeluhr.csv",out,"text/csv");
}

function backup(){
  download("stempeluhr-backup.json",JSON.stringify({entries,active}),"application/json");
}

function restore(){
  let i=document.createElement("input");
  i.type="file";
  i.accept=".json";
  i.onchange=()=>{
    let r=new FileReader();
    r.onload=()=>{
      try{
        let x=JSON.parse(r.result);
        entries=x.entries||[];
        active=x.active||null;
        save();render();
      }catch{alert("Ungültige Datei")}
    };
    r.readAsText(i.files[0]);
  };
  i.click();
}

function download(name,data,type){
  let a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([data],{type}));
  a.download=name;
  a.click();
}

function clearAll(){
  if(confirm("Wirklich alle Daten löschen?")){
    entries=[];active=null;save();render();
  }
}

function safe(s){
  return s.replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function theme(){
  document.body.classList.toggle("dark");
  localStorage.theme=document.body.classList.contains("dark")?"dark":"light";
}

if(localStorage.theme=="dark")document.body.classList.add("dark");

function tick(){
  if(active){
    $("clock").textContent=dur(active.start,new Date());
    stats();
  }else $("clock").textContent="00:00:00";
}

if(active){
  $("punch").textContent="Ausstempeln";
  $("punch").className="red";
}

render();
tick();
setInterval(tick,1000);
</script>
</body>
</html>
