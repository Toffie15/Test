<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0f14">

<title>Stempeluhr</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    min-height:100vh;

    background:
        radial-gradient(
            circle at top,
            #241b3d 0,
            #0d0f14 48%
        );

    color:#f5f5f7;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:#171a21;

    border:1px solid #2b303b;

    border-radius:18px;

    padding:22px;

    margin-bottom:16px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.35);
}


/* HEADER */

.header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:18px;
}

.logo{
    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #5b21b6
        );

    font-size:24px;
}

h1{
    margin:0;

    font-size:25px;
}

h2{
    margin:0 0 15px;

    font-size:17px;
}

.sub{
    color:#8f98a8;

    font-size:13px;
}


/* CLOCK */

.clock{
    text-align:center;

    padding:40px 20px;
}

.status{
    color:#8f98a8;

    margin-bottom:10px;
}

.time{
    font-size:70px;

    font-family:monospace;

    letter-spacing:-3px;

    margin:20px 0 8px;
}

.since{
    min-height:20px;

    color:#8f98a8;
}


/* INPUT */

input{
    width:100%;

    padding:13px;

    margin:8px 0;

    border-radius:11px;

    border:1px solid #303641;

    background:#22262e;

    color:white;

    font-size:15px;

    outline:none;
}

input:focus{
    border-color:#8b5cf6;
}


/* BUTTONS */

button{
    border:0;

    border-radius:11px;

    padding:12px 17px;

    margin:5px 0;

    background:#8b5cf6;

    color:white;

    font-weight:bold;

    cursor:pointer;
}

button:hover{
    filter:brightness(1.1);
}

button.red{
    background:#9d3838;
}

button.gray{
    background:#303641;
}

.punch{
    width:280px;

    padding:16px;

    font-size:16px;

    margin-top:18px;
}


/* STATISTIK */

.stats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;

    margin-bottom:16px;
}

.stat{
    background:#171a21;

    border:1px solid #2b303b;

    border-radius:14px;

    padding:17px;
}

.stat span{
    color:#8f98a8;

    font-size:11px;

    text-transform:uppercase;
}

.stat b{
    display:block;

    font-size:23px;

    font-family:monospace;

    margin-top:7px;
}


/* TABELLE */

.actions{
    display:flex;

    gap:7px;

    flex-wrap:wrap;
}

.table{
    overflow-x:auto;
}

table{
    width:100%;

    min-width:650px;

    border-collapse:collapse;
}

th,
td{
    padding:12px 10px;

    text-align:left;

    border-bottom:
        1px solid #2c313b;
}

th{
    color:#8f98a8;

    font-size:11px;

    text-transform:uppercase;
}

td{
    font-family:monospace;
}

td.note{
    font-family:Arial,sans-serif;

    color:#aab1bd;
}


/* MOBILE */

@media(max-width:650px){

    body{
        padding:10px;
    }

    .card{
        padding:16px;

        border-radius:14px;
    }

    .header{
        align-items:flex-start;
    }

    .time{
        font-size:43px;

        letter-spacing:-2px;
    }

    .punch{
        width:100%;
    }

    .stats{
        grid-template-columns:
            1fr 1fr;
    }

    .stats .stat:last-child{
        grid-column:
            1 / -1;
    }

    .actions{
        width:100%;
    }

    .actions button{
        flex:1;
    }

    table{
        font-size:13px;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

<div style="display:flex;gap:12px;align-items:center;">

<div class="logo">
⏱️
</div>

<div>

<h1>Stempeluhr</h1>

<div
id="currentDate"
class="sub">
</div>

</div>

</div>

</div>


<!-- UHR -->

<section class="card clock">


<div
id="status"
class="status">

🔴 Ausgestempelt

</div>


<div
id="timer"
class="time">

00:00:00

</div>


<div
id="since"
class="since">

</div>


<input
id="note"
placeholder="Notiz, z. B. Büro oder Projekt"
>


<button
id="punchButton"
class="punch"
onclick="punch()">

Einstempeln

</button>


</section>


<!-- STATISTIK -->

<div class="stats">


<div class="stat">

<span>
Heute
</span>

<b id="today">
0h 00m
</b>

</div>


<div class="stat">

<span>
Diese Woche
</span>

<b id="week">
0h 00m
</b>

</div>


<div class="stat">

<span>
Einträge
</span>

<b id="entryCount">
0
</b>

</div>


</div>


<!-- ZEITERFASSUNG -->

<section class="card">


<div class="header">

<h2>
Zeiterfassung
</h2>


<div class="actions">

<button
onclick="exportCSV()">

CSV Export

</button>


<button
class="red"
onclick="deleteAll()">

Alles löschen

</button>

</div>

</div>


<div class="table">


<table>

<thead>

<tr>

<th>
Datum
</th>

<th>
Start
</th>

<th>
Ende
</th>

<th>
Dauer
</th>

<th>
Notiz
</th>

</tr>

</thead>


<tbody id="log">
</tbody>


</table>


</div>


<p
id="empty"
class="sub"
style="text-align:center;">

Noch keine Einträge.

</p>


</section>


</div>


<script>


/* =========================================
   DATEN
========================================= */

let active = null;

let entries = [];


/* =========================================
   DATEN LADEN
========================================= */

function loadData(){

    try{

        entries =
            JSON.parse(
                localStorage.getItem(
                    "stempeluhr_entries"
                ) || "[]"
            );

    }catch{

        entries = [];

    }


    try{

        active =
            JSON.parse(
                localStorage.getItem(
                    "stempeluhr_active"
                ) || "null"
            );

    }catch{

        active = null;

    }


    render();

}


/* =========================================
   DATEN SPEICHERN
========================================= */

function saveData(){

    localStorage.setItem(
        "stempeluhr_entries",
        JSON.stringify(entries)
    );


    if(active){

        localStorage.setItem(
            "stempeluhr_active",
            JSON.stringify(active)
        );

    }else{

        localStorage.removeItem(
            "stempeluhr_active"
        );

    }

}


/* =========================================
   EINSTEMPELN
========================================= */

function punch(){


    if(active){

        /* AUSSTEMPELN */

        entries.push({

            start:active.start,

            end:Date.now(),

            note:
                document
                .getElementById("note")
                .value
                .trim()

        });


        active = null;


        document
            .getElementById("note")
            .value = "";


    }else{


        /* EINSTEMPELN */

        active = {

            start:Date.now(),

            note:
                document
                .getElementById("note")
                .value
                .trim()

        };

    }


    saveData();

    render();

}


/* =========================================
   ANZEIGE
========================================= */

function render(){


    const status =
        document.getElementById(
            "status"
        );


    const button =
        document.getElementById(
            "punchButton"
        );


    const since =
        document.getElementById(
            "since"
        );


    if(active){


        status.textContent =
            "🟢 Eingestempelt";


        button.textContent =
            "Ausstempeln";


        button.className =
            "punch red";


        since.textContent =
            "Seit " +
            formatTime(active.start) +
            " Uhr";


        updateTimer();


    }else{


        status.textContent =
            "🔴 Ausgestempelt";


        button.textContent =
            "Einstempeln";


        button.className =
            "punch";


        document
            .getElementById("timer")
            .textContent =
            "00:00:00";


        since.textContent = "";

    }


    renderTable();

    updateStats();

}


/* =========================================
   TABELLE
========================================= */

function renderTable(){


    const log =
        document.getElementById(
            "log"
        );


    log.innerHTML = "";


    const sorted =
        [...entries]
        .sort(
            (a,b) =>
                b.start - a.start
        );


    sorted.forEach(entry=>{


        const row =
            document.createElement(
                "tr"
            );


        row.innerHTML = `

        <td>
            ${formatDate(entry.start)}
        </td>

        <td>
            ${formatTime(entry.start)}
        </td>

        <td>
            ${formatTime(entry.end)}
        </td>

        <td>
            ${duration(
                entry.end -
                entry.start
            )}
        </td>

        <td class="note">
            ${escapeHTML(
                entry.note || "-"
            )}
        </td>

        `;


        log.appendChild(row);

    });


    document
        .getElementById("empty")
        .style.display =
        entries.length
        ? "none"
        : "block";


    document
        .getElementById("entryCount")
        .textContent =
        entries.length;

}


/* =========================================
   LIVE TIMER
========================================= */

function updateTimer(){


    if(!active)
        return;


    const ms =
        Date.now() -
        active.start;


    const totalSeconds =
        Math.floor(
            ms / 1000
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    document
        .getElementById("timer")
        .textContent =

        String(hours)
        .padStart(2,"0")

        + ":"

        + String(minutes)
        .padStart(2,"0")

        + ":"

        + String(seconds)
        .padStart(2,"0");

}


/* =========================================
   STATISTIK
========================================= */

function updateStats(){


    let today = 0;

    let week = 0;


    const now =
        new Date();


    const startToday =
        new Date(now);


    startToday.setHours(
        0,
        0,
        0,
        0
    );


    const startWeek =
        new Date(startToday);


    const day =
        (startWeek.getDay()+6)%7;


    startWeek.setDate(
        startWeek.getDate() -
        day
    );


    entries.forEach(entry=>{


        const time =
            entry.end -
            entry.start;


        if(
            entry.start >=
            startToday
        ){

            today += time;

        }


        if(
            entry.start >=
            startWeek
        ){

            week += time;

        }

    });


    if(active){


        const time =
            Date.now() -
            active.start;


        if(
            active.start >=
            startToday
        ){

            today += time;

        }


        if(
            active.start >=
            startWeek
        ){

            week += time;

        }

    }


    document
        .getElementById("today")
        .textContent =
        duration(today);


    document
        .getElementById("week")
        .textContent =
        duration(week);

}


/* =========================================
   ZEIT FORMATIEREN
========================================= */

function formatTime(timestamp){

    return new Date(timestamp)
        .toLocaleTimeString(
            "de-DE",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


/* =========================================
   DATUM FORMATIEREN
========================================= */

function formatDate(timestamp){

    return new Date(timestamp)
        .toLocaleDateString(
            "de-DE"
        );

}


/* =========================================
   DAUER
========================================= */

function duration(ms){


    const minutes =
        Math.floor(
            ms / 60000
        );


    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    return (
        hours +
        "h " +
        String(mins)
        .padStart(2,"0") +
        "m"
    );

}


/* =========================================
   CSV EXPORT
========================================= */

function exportCSV(){


    if(!entries.length){

        alert(
            "Keine Zeiteinträge vorhanden."
        );

        return;

    }


    const rows = [

        [
            "Datum",
            "Start",
            "Ende",
            "Dauer",
            "Notiz"
        ]

    ];


    const sorted =
        [...entries]
        .sort(
            (a,b) =>
                a.start - b.start
        );


    sorted.forEach(entry=>{


        rows.push([

            formatDate(
                entry.start
            ),

            formatTime(
                entry.start
            ),

            formatTime(
                entry.end
            ),

            duration(
                entry.end -
                entry.start
            ),

            entry.note || ""

        ]);

    });


    const csv =

        "\uFEFF" +

        rows
        .map(row=>

            row
            .map(value=>

                '"' +
                String(value)
                .replace(
                    /"/g,
                    '""'
                ) +
                '"'

            )
            .join(";")

        )
        .join("\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                "text/csv;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    link.download =
        "stempeluhr_" +
        new Date()
        .toISOString()
        .slice(0,10) +
        ".csv";


    document
        .body
        .appendChild(link);


    link.click();


    link.remove();


    URL.revokeObjectURL(url);

}


/* =========================================
   ALLES LÖSCHEN
========================================= */

function deleteAll(){


    if(
        !confirm(
            "Wirklich alle Zeiteinträge löschen?"
        )
    ){

        return;

    }


    entries = [];


    saveData();

    render();

}


/* =========================================
   HTML SICHER MACHEN
========================================= */

function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );


    div.textContent = text;


    return div.innerHTML;

}


/* =========================================
   DATUM IM HEADER
========================================= */

document
    .getElementById(
        "currentDate"
    )
    .textContent =

    new Date()
    .toLocaleDateString(
        "de-DE",
        {
            weekday:"long",
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    );


/* =========================================
   JEDE SEKUNDE AKTUALISIEREN
========================================= */

setInterval(()=>{

    if(active){

        updateTimer();

        updateStats();

    }

},1000);


/* =========================================
   START
========================================= */

loadData();

</script>

</body>
</html>
