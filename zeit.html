<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>Stempeluhr</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:20px;
min-height:100vh;
background:#0e1014;
color:#f5f7fa;
font-family:Arial,sans-serif
}

main{
max-width:900px;
margin:auto
}

.hidden{
display:none!important
}

.card{
background:#181b21;
border:1px solid #2b3039;
border-radius:16px;
padding:20px;
margin-bottom:15px;
box-shadow:0 10px 35px #0006
}

.logo{
width:44px;
height:44px;
display:grid;
place-items:center;
border-radius:13px;
background:linear-gradient(135deg,#8b5cf6,#5b21b6);
font-size:22px;
margin-bottom:15px
}

h1{
margin:0 0 5px;
font-size:24px
}

h2{
font-size:16px;
margin-top:0
}

.sub,
small{
color:#8d96a5
}

input{
width:100%;
padding:13px;
margin:6px 0;
border-radius:10px;
border:1px solid #303641;
background:#22262e;
color:white;
font-size:15px;
outline:none
}

input:focus{
border-color:#8b5cf6
}

button{
border:0;
border-radius:10px;
padding:12px 16px;
margin:5px 0;
background:#8b5cf6;
color:white;
font-weight:bold;
cursor:pointer
}

button:hover{
filter:brightness(1.1)
}

button.red{
background:#a83e3e
}

button.gray{
background:#303641
}

.login{
max-width:420px;
margin:70px auto
}

.login .logo{
margin-left:auto;
margin-right:auto
}

.login h1,
.login .sub{
text-align:center
}

.error{
color:#ef6666;
min-height:20px
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:18px
}

.user{
color:#9da5b2;
margin-right:8px
}

.clock{
text-align:center;
padding:35px 20px
}

.status{
color:#9da5b2;
margin-bottom:15px
}

.time{
font-size:70px;
font-family:monospace;
margin:15px 0
}

.since{
min-height:20px;
margin-bottom:12px
}

.punch{
width:280px;
font-size:16px;
padding:15px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:15px
}

.stat{
background:#20242b;
border:1px solid #303641;
border-radius:12px;
padding:16px
}

.stat span{
font-size:11px;
color:#8d96a5;
text-transform:uppercase
}

.stat b{
display:block;
font-size:23px;
font-family:monospace;
margin-top:7px
}

.row{
display:flex;
gap:10px
}

.row>*{
flex:1
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap
}

.table{
overflow-x:auto
}

table{
width:100%;
min-width:650px;
border-collapse:collapse
}

th,
td{
padding:11px;
border-bottom:1px solid #303641;
text-align:left
}

th{
font-size:11px;
color:#8d96a5;
text-transform:uppercase
}

td{
font-family:monospace
}

.note{
font-family:Arial,sans-serif;
color:#aab1bd
}

.admin-user{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid #303641
}

hr{
border:0;
border-top:1px solid #303641;
margin:18px 0
}

@media(max-width:650px){

body{
padding:10px
}

.card{
padding:16px;
border-radius:13px
}

.login{
margin:30px auto
}

.header{
align-items:flex-start
}

.user{
display:block;
margin-bottom:5px
}

.time{
font-size:43px
}

.punch{
width:100%
}

.stats{
grid-template-columns:1fr 1fr
}

.stats .stat:last-child{
grid-column:1/-1
}

.row{
flex-direction:column
}

.actions button{
flex:1
}

table{
font-size:13px
}

}
</style>
</head>

<body>

<main>


<!-- ================= LOGIN ================= -->

<section id="login" class="card login">

<div class="logo">
⏱
</div>

<h1>Stempeluhr</h1>

<div class="sub">
Arbeitszeit einfach erfassen
</div>

<br>

<input
id="username"
type="text"
placeholder="Benutzername"
autocomplete="username">

<input
id="password"
type="password"
placeholder="Passwort"
autocomplete="current-password">

<button
onclick="login()"
style="width:100%">

Einloggen

</button>

<p id="error" class="error"></p>

<hr>

<small>
<b>Test-Account</b><br><br>
Benutzername: <b>test</b><br>
Passwort: <b>test1234</b>
</small>

</section>


<!-- ================= APP ================= -->

<section id="app" class="hidden">


<!-- HEADER -->

<div class="header">

<div>

<h1>⏱ Stempeluhr</h1>

<div
id="date"
class="sub">
</div>

</div>

<div>

<span
id="userDisplay"
class="user">
</span>

<button
class="gray"
onclick="logout()">

Abmelden

</button>

</div>

</div>


<!-- ================= ADMIN ================= -->

<section
id="admin"
class="card hidden">

<h2>
Benutzerverwaltung
</h2>

<div class="row">

<input
id="newUser"
placeholder="Neuer Benutzer">

<input
id="newPassword"
type="password"
placeholder="Passwort">

<button onclick="createUser()">
Erstellen
</button>

</div>

<div id="userList"></div>

</section>


<!-- ================= CLOCK ================= -->

<section
id="clockCard"
class="card clock">

<div
id="status"
class="status">

🔴 Ausgestempelt

</div>

<div
id="timer"
class="time">

00:00:00

</div>

<div
id="since"
class="since sub">
</div>

<input
id="note"
placeholder="Notiz, z. B. Büro oder Projekt">

<button
id="punchButton"
class="punch"
onclick="punch()">

Einstempeln

</button>

</section>


<!-- ================= STATS ================= -->

<div class="stats">

<div class="stat">

<span>
Heute
</span>

<b id="today">
0h 00m
</b>

</div>


<div class="stat">

<span>
Diese Woche
</span>

<b id="week">
0h 00m
</b>

</div>


<div class="stat">

<span>
Einträge
</span>

<b id="count">
0
</b>

</div>

</div>


<!-- ================= LOG ================= -->

<section class="card">

<div class="header">

<h2>
Zeiterfassung
</h2>

<div class="actions">

<button
onclick="exportCSV()">

CSV Export

</button>

<button
class="red"
onclick="deleteAll()">

Löschen

</button>

</div>

</div>


<div class="table">

<table>

<thead>

<tr>

<th>
Datum
</th>

<th>
Start
</th>

<th>
Ende
</th>

<th>
Dauer
</th>

<th>
Notiz
</th>

</tr>

</thead>

<tbody id="log">
</tbody>

</table>

</div>


<p
id="empty"
class="sub"
style="text-align:center">

Noch keine Einträge.

</p>

</section>

</section>

</main>


<script>

/* ==================================================
   GRUNDVARIABLEN
================================================== */

let currentUser = null;
let active = null;
let entries = [];

const $ = id => document.getElementById(id);


/* ==================================================
   BENUTZER
================================================== */

function setup(){

/*
   Test-Account wird automatisch erstellt.
*/

if(!localStorage.getItem("user:test")){

localStorage.setItem(

"user:test",

JSON.stringify({

password:"test1234",

admin:true

})

);

}

}


/* ==================================================
   LOGIN
================================================== */

function login(){

const username =
$("username")
.value
.trim()
.toLowerCase();

const password =
$("password")
.value;

$("error").textContent = "";


/*
   Eingabe prüfen
*/

if(!username || !password){

$("error").textContent =
"Bitte Benutzername und Passwort eingeben.";

return;

}


/*
   Benutzer suchen
*/

const stored =
localStorage.getItem(
"user:"+username
);

if(!stored){

$("error").textContent =
"Benutzername oder Passwort falsch.";

return;

}


/*
   Benutzerdaten lesen
*/

let account;

try{

account = JSON.parse(stored);

}catch{

$("error").textContent =
"Fehler beim Benutzerkonto.";

return;

}


/*
   Passwort prüfen
*/

if(account.password !== password){

$("error").textContent =
"Benutzername oder Passwort falsch.";

return;

}


/*
   Login erfolgreich
*/

currentUser = username;

$("login")
.classList
.add("hidden");

$("app")
.classList
.remove("hidden");


/*
   Benutzer anzeigen
*/

$("userDisplay").textContent =
"@"+
username+
(account.admin ? " • ADMIN" : "");


/*
   Datum
*/

$("date").textContent =
new Date()
.toLocaleDateString(
"de-DE",
{
weekday:"long",
day:"2-digit",
month:"long",
year:"numeric"
}
);


/*
   Admin anzeigen
*/

if(account.admin){

$("admin")
.classList
.remove("hidden");

showUsers();

}


/*
   Daten laden
*/

load();

}


/* ==================================================
   DATEN LADEN
================================================== */

function load(){

entries =
JSON.parse(

localStorage.getItem(
"entries:"+currentUser
)||"[]"

);


active =
JSON.parse(

localStorage.getItem(
"active:"+currentUser
)||"null"

);


render();

}


/* ==================================================
   DATEN SPEICHERN
================================================== */

function save(){

localStorage.setItem(

"entries:"+currentUser,

JSON.stringify(entries)

);


if(active){

localStorage.setItem(

"active:"+currentUser,

JSON.stringify(active)

);

}else{

localStorage.removeItem(

"active:"+currentUser

);

}

}


/* ==================================================
   EINSTEMPELN / AUSSTEMPELN
================================================== */

function punch(){

/*
   Wenn bereits eingestempelt:
   Arbeitszeit beenden.
*/

if(active){

entries.push({

start:active.start,

end:Date.now(),

note:$("note")
.value
.trim()

});

active = null;


/*
   Wenn ausgestempelt:
   neue Arbeitszeit starten.
*/

}else{

active = {

start:Date.now(),

note:$("note")
.value
.trim()

};

}


/*
   Speichern
*/

save();

render();

}


/* ==================================================
   HAUPTANZEIGE
================================================== */

function render(){

/*
   Eingestempelt
*/

if(active){

$("status").textContent =
"🟢 Eingestempelt";

$("punchButton").textContent =
"Ausstempeln";

$("punchButton")
.className =
"punch red";

$("since").textContent =
"Seit "+
formatTime(active.start)+
" Uhr";

}else{


/*
   Ausgestempelt
*/

$("status").textContent =
"🔴 Ausgestempelt";

$("punchButton").textContent =
"Einstempeln";

$("punchButton")
.className =
"punch";

$("timer").textContent =
"00:00:00";

$("since").textContent = "";

}


/*
   Tabelle leeren
*/

$("log").innerHTML = "";


/*
   Einträge sortieren
*/

const sorted =
[...entries]
.sort(
(a,b)=>b.start-a.start
);


/*
   Tabelle erstellen
*/

sorted.forEach(entry=>{

const row =
document.createElement("tr");


row.innerHTML = `

<td>
${formatDate(entry.start)}
</td>

<td>
${formatTime(entry.start)}
</td>

<td>
${formatTime(entry.end)}
</td>

<td>
${duration(
entry.end-entry.start
)}
</td>

<td class="note">
${escapeHTML(
entry.note || "-"
)}
</td>

`;


$("log")
.appendChild(row);

});


/*
   Leer-Meldung
*/

$("empty").style.display =
entries.length
? "none"
: "block";


/*
   Anzahl
*/

$("count").textContent =
entries.length;


/*
   Statistik
*/

updateStats();

}


/* ==================================================
   ZEIT FORMATIEREN
================================================== */

function formatTime(time){

return new Date(time)
.toLocaleTimeString(
"de-DE",
{
hour:"2-digit",
minute:"2-digit"
}
);

}


/* ==================================================
   DATUM FORMATIEREN
================================================== */

function formatDate(time){

return new Date(time)
.toLocaleDateString(
"de-DE"
);

}


/* ==================================================
   DAUER
================================================== */

function duration(ms){

let minutes =
Math.floor(
ms/60000
);

let hours =
Math.floor(
minutes/60
);

minutes =
minutes%60;


return hours+
"h "+
String(minutes)
.padStart(2,"0")+
"m";

}


/* ==================================================
   STATISTIK
================================================== */

function updateStats(){

let today = 0;
let week = 0;


const now =
new Date();


/*
   Heute 00:00
*/

const startToday =
new Date(now);

startToday.setHours(
0,0,0,0
);


/*
   Montag dieser Woche
*/

const monday =
new Date(startToday);

const day =
(monday.getDay()+6)%7;

monday.setDate(
monday.getDate()-day
);


/*
   Einträge berechnen
*/

entries.forEach(entry=>{

const time =
entry.end-entry.start;


if(entry.start>=startToday){

today += time;

}


if(entry.start>=monday){

week += time;

}

});


/*
   Aktive Arbeitszeit
*/

if(active){

const time =
Date.now()-active.start;


if(active.start>=startToday){

today += time;

}


if(active.start>=monday){

week += time;

}

}


/*
   Anzeigen
*/

$("today").textContent =
duration(today);

$("week").textContent =
duration(week);

}


/* ==================================================
   LIVE TIMER
================================================== */

setInterval(()=>{

if(!active)
return;


const ms =
Date.now()-active.start;


const seconds =
Math.floor(ms/1000);


const hours =
Math.floor(
seconds/3600
);


const minutes =
Math.floor(
(seconds%3600)/60
);


const secs =
seconds%60;


$("timer").textContent =

String(hours)
.padStart(2,"0")

+

":"

+

String(minutes)
.padStart(2,"0")

+

":"

+

String(secs)
.padStart(2,"0");


updateStats();

},1000);


/* ==================================================
   CSV EXPORT
================================================== */

function exportCSV(){

if(!entries.length){

alert(
"Keine Zeiteinträge vorhanden."
);

return;

}


/*
   CSV Kopfzeile
*/

const rows = [

[
"Datum",
"Start",
"Ende",
"Dauer",
"Notiz"
]

];


/*
   Einträge sortieren
*/

const sorted =
[...entries]
.sort(
(a,b)=>a.start-b.start
);


/*
   CSV Daten
*/

sorted.forEach(entry=>{

rows.push([

formatDate(
entry.start
),

formatTime(
entry.start
),

formatTime(
entry.end
),

duration(
entry.end-entry.start
),

entry.note || ""

]);

});


/*
   CSV erzeugen
*/

const csv =

"\uFEFF"+

rows
.map(row=>

row
.map(value=>

'"'+
String(value)
.replace(/"/g,'""')+
'"'

)
.join(";")

)
.join("\n");


/*
   Datei erstellen
*/

const blob =
new Blob(
[csv],
{
type:
"text/csv;charset=utf-8"
}
);


const url =
URL.createObjectURL(blob);


const link =
document.createElement("a");


link.href = url;

link.download =
"stempeluhr_"+
currentUser+
".csv";


document.body
.appendChild(link);

link.click();

link.remove();

URL.revokeObjectURL(url);

}


/* ==================================================
   BENUTZER ERSTELLEN
================================================== */

function createUser(){

const username =
$("newUser")
.value
.trim()
.toLowerCase();


const password =
$("newPassword")
.value;


if(!username){

alert(
"Bitte Benutzernamen eingeben."
);

return;

}


if(password.length<6){

alert(
"Das Passwort muss mindestens 6 Zeichen haben."
);

return;

}


if(
localStorage.getItem(
"user:"+username
)
){

alert(
"Dieser Benutzer existiert bereits."
);

return;

}


/*
   Benutzer speichern
*/

localStorage.setItem(

"user:"+username,

JSON.stringify({

password:password,

admin:false

})

);


/*
   Felder leeren
*/

$("newUser").value = "";

$("newPassword").value = "";


/*
   Liste aktualisieren
*/

showUsers();

}


/* ==================================================
   BENUTZERLISTE
================================================== */

function showUsers(){

$("userList").innerHTML = "";


Object.keys(localStorage)

.filter(
key =>
key.startsWith("user:")
)

.forEach(key=>{

const username =
key.substring(5);


const account =
JSON.parse(
localStorage.getItem(key)
);


const div =
document.createElement("div");


div.className =
"admin-user";


const name =
document.createElement("span");


name.textContent =
"@"+
username+
(account.admin
? " • ADMIN"
: "");


div.appendChild(name);


/*
   Test-Account / aktuellen Account
   nicht löschen
*/

if(username!==currentUser){

const button =
document.createElement("button");

button.className =
"red";

button.textContent =
"Löschen";


button.onclick = ()=>{

if(!confirm(
"Benutzer "+
username+
" wirklich löschen?"
))return;


localStorage.removeItem(
"user:"+username
);

localStorage.removeItem(
"entries:"+username
);

localStorage.removeItem(
"active:"+username
);


showUsers();

};


div.appendChild(button);

}


$("userList")
.appendChild(div);

});

}


/* ==================================================
   ALLE EINTRÄGE LÖSCHEN
================================================== */

function deleteAll(){

if(!confirm(
"Alle Zeiteinträge löschen?"
))
return;


entries = [];


save();

render();

}


/* ==================================================
   LOGOUT
================================================== */

function logout(){

currentUser = null;

active = null;

entries = [];


$("app")
.classList
.add("hidden");


$("login")
.classList
.remove("hidden");


$("username").value = "";

$("password").value = "";

$("error").textContent = "";

}


/* ==================================================
   HTML SICHER MACHEN
================================================== */

function escapeHTML(text){

const div =
document.createElement("div");

div.textContent = text;

return div.innerHTML;

}


/* ==================================================
   START
================================================== */

setup();

</script>

</body>
</html>
