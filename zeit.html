<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stempeluhr</title>

<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:radial-gradient(circle at top,#241b3d,#0d0f14 55%);color:#fff;font-family:Arial}
.container{max-width:850px;margin:auto}
.card,.stat{background:#171a21;border:1px solid #2b303b;border-radius:15px;padding:18px;margin-bottom:14px}
.header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:28px}
h1,h2{margin:0 0 8px}
.sub,.status,.since,th{color:#8f98a8;font-size:13px}
.clock{text-align:center;padding:35px 15px}
.time{font:65px monospace;margin:20px 0}
input,button{border-radius:10px;padding:12px;border:1px solid #303641}
input{width:100%;background:#22262e;color:#fff;margin:8px 0}
button{background:#8b5cf6;color:#fff;font-weight:bold;cursor:pointer;border:0;margin:4px}
.red{background:#9d3838}
.gray{background:#303641}
.punch{width:280px;font-size:16px;margin-top:15px}
.pausebtn{width:280px;font-size:14px;margin-top:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat span{color:#8f98a8;font-size:11px;text-transform:uppercase}
.stat b{display:block;font:22px monospace;margin-top:5px}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.table{overflow:auto}
table{width:100%;min-width:680px;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid #2c313b}
td{font-family:monospace}
td.note{font-family:Arial;color:#aab1bd}
td.actions-cell{font-family:Arial;white-space:nowrap}
td.actions-cell button{padding:6px 10px;font-size:12px;margin:0 2px}
.footer{text-align:center;color:#666d7a;font-size:12px;padding:5px 0 15px}
.hint{color:#8f98a8;font-size:12px;margin-top:-4px}
.reminder{background:#2a2410;border:1px solid #5a4a1a;color:#e8c96a;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.reminder button{background:#5a4a1a;padding:6px 10px;font-size:12px;margin:0}
body.light{background:#f2f3f7;color:#171a21}
body.light .card,body.light .stat{background:#fff;border-color:#ddd}
body.light input{background:#f7f8fa;color:#171a21}
body.light .reminder{background:#fff6df;border-color:#e8d9a8;color:#7a5f10}

#loader{position:fixed;inset:0;background:#0d0f14;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
#loader .logo2{font-size:40px}
.barwrap{width:220px;height:8px;background:#22262e;border-radius:6px;overflow:hidden}
.bar{height:100%;width:0%;background:#8b5cf6;border-radius:6px;transition:width .1s linear}
#loader .msg{color:#8f98a8;font-size:13px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:500;padding:15px}
.modal-bg.show{display:flex}
.modal{background:#171a21;border:1px solid #2b303b;border-radius:15px;padding:20px;max-width:380px;width:100%}
body.light .modal{background:#fff;border-color:#ddd}
.modal h3{margin:0 0 12px}
.modal label{display:block;font-size:12px;color:#8f98a8;margin:10px 0 4px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

@media(max-width:600px){
 body{padding:8px}.time{font-size:42px}.punch,.pausebtn{width:100%}
 .stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}
 .actions button{flex:1}
}
</style>
</head>

<body>

<div id="loader">
 <div class="logo2">⏱️</div>
 <div class="barwrap"><div class="bar" id="loadbar"></div></div>
 <div class="msg" id="loadmsg">Lade Stempeluhr…</div>
</div>

<div class="container">

<header class="header">
 <div>
  <h1>⏱️ Stempeluhr</h1>
  <div id="date" class="sub"></div>
 </div>
 <button class="gray" onclick="theme()" aria-label="Design umschalten">🌓</button>
</header>

<div id="backupReminder" class="reminder" style="display:none">
 <span id="reminderText"></span>
 <button onclick="backup(); dismissReminder(true)">Jetzt sichern</button>
</div>

<section class="card clock">
 <div id="status" class="status">🔴 Ausgestempelt</div>
 <div id="timer" class="time">00:00:00</div>
 <div id="since" class="since"></div>
 <input id="note" placeholder="Notiz, z. B. Büro oder Projekt">
 <div class="hint" id="noteHint" style="display:none">Notiz wird beim Ausstempeln für diesen Eintrag gespeichert.</div>
 <button id="punch" class="punch" onclick="punch()">Einstempeln</button>
 <div id="pauseWrap" style="display:none">
  <button id="pauseBtn" class="pausebtn gray" onclick="togglePause()">Pause starten</button>
  <div class="hint" id="pauseInfo"></div>
 </div>
</section>

<div class="stats">
 <div class="stat"><span>Heute</span><b id="today">0h 00m</b></div>
 <div class="stat"><span>Woche</span><b id="week">0h 00m</b></div>
 <div class="stat"><span>Einträge</span><b id="count">0</b></div>
</div>

<section class="card">
 <div class="header">
  <h2>Monatsübersicht</h2>
  <div>
   <button class="gray" onclick="month(-1)" aria-label="Vorheriger Monat">‹</button>
   <button class="gray" onclick="month(1)" aria-label="Nächster Monat">›</button>
  </div>
 </div>
 <div id="month" class="sub"></div>
 <div id="summary"></div>
</section>

<section class="card">
 <div class="header">
  <h2>Zeiterfassung</h2>
  <div class="actions">
   <button onclick="csv()">CSV</button>
   <button onclick="backup()">Backup</button>
   <button onclick="document.getElementById('file').click()">Import</button>
   <button class="red" onclick="clearAll()">Löschen</button>
   <input id="file" type="file" accept=".json" hidden onchange="restore(event)">
  </div>
 </div>

 <div class="table">
  <table>
   <thead><tr>
    <th>Datum</th><th>Start</th><th>Ende</th><th>Dauer</th><th>Pause</th><th>Notiz</th><th></th>
   </tr></thead>
   <tbody id="log"></tbody>
  </table>
 </div>

 <p id="empty" class="sub" style="text-align:center">Noch keine Einträge.</p>
</section>

<div class="footer">Made by Luca Valentine</div>

</div>

<!-- Edit modal -->
<div class="modal-bg" id="editModal">
 <div class="modal">
  <h3>Eintrag bearbeiten</h3>
  <label>Datum</label>
  <input id="editDate" type="date">
  <label>Start</label>
  <input id="editStart" type="time">
  <label>Ende</label>
  <input id="editEnd" type="time">
  <label>Pause (Minuten)</label>
  <input id="editPause" type="number" min="0" step="1">
  <label>Notiz</label>
  <input id="editNote">
  <div class="row">
   <button class="gray" onclick="closeEdit()">Abbrechen</button>
   <button onclick="saveEdit()">Speichern</button>
  </div>
 </div>
</div>

<script>
let entries=JSON.parse(localStorage.getItem("entries")||"[]"),
active=JSON.parse(localStorage.getItem("active")||"null"),
sel=new Date(new Date().getFullYear(),new Date().getMonth(),1),
editId=null;

const $=id=>document.getElementById(id);
const save=()=>{
 localStorage.setItem("entries",JSON.stringify(entries));
 active?localStorage.setItem("active",JSON.stringify(active)):
 localStorage.removeItem("active");
};

const time=t=>new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
const date=t=>new Date(t).toLocaleDateString("de-DE");
const dur=ms=>{
 let m=Math.round(ms/60000),h=Math.floor(m/60);
 return h+"h "+String(m%60).padStart(2,"0")+"m";
};

/* ---------- Ein-/Ausstempeln + Pause ---------- */

function punch(){
 if(active){
  if(active.pauseStart){
   active.pauseMs=(active.pauseMs||0)+(Date.now()-active.pauseStart);
   active.pauseStart=null;
  }
  entries.push({
   id:Date.now()+"_"+Math.random().toString(36).slice(2,7),
   start:active.start,
   end:Date.now(),
   pauseMs:active.pauseMs||0,
   note:$("note").value.trim()
  });
  active=null;
  $("note").value="";
 }else{
  active={start:Date.now(),note:$("note").value.trim(),pauseMs:0,pauseStart:null};
 }
 save();render();maybeShowReminder();
}

function togglePause(){
 if(!active)return;
 if(active.pauseStart){
  active.pauseMs=(active.pauseMs||0)+(Date.now()-active.pauseStart);
  active.pauseStart=null;
 }else{
  active.pauseStart=Date.now();
 }
 save();render();
}

/* ---------- Rendern ---------- */

function render(){
 $("status").textContent=active?(active.pauseStart?"⏸️ Pause":"🟢 Eingestempelt"):"🔴 Ausgestempelt";
 $("punch").textContent=active?"Ausstempeln":"Einstempeln";
 $("punch").className=active?"punch red":"punch";
 $("since").textContent=active?"Seit "+time(active.start)+" Uhr":"";
 $("noteHint").style.display=active?"block":"none";
 $("pauseWrap").style.display=active?"block":"none";
 if(active){
  $("pauseBtn").textContent=active.pauseStart?"Pause beenden":"Pause starten";
  $("pauseBtn").className=active.pauseStart?"pausebtn red":"pausebtn gray";
 }
 if(!active)$("timer").textContent="00:00:00";

 $("log").innerHTML=[...entries].sort((a,b)=>b.start-a.start).map(e=>`
  <tr>
   <td>${date(e.start)}</td>
   <td>${time(e.start)}</td>
   <td>${time(e.end)}</td>
   <td>${dur(e.end-e.start-(e.pauseMs||0))}</td>
   <td>${e.pauseMs?dur(e.pauseMs):"–"}</td>
   <td class="note">${safe(e.note||"-")}</td>
   <td class="actions-cell">
    <button class="gray" onclick="openEdit('${e.id}')">✏️</button>
    <button class="red" onclick="deleteEntry('${e.id}')">🗑️</button>
   </td>
  </tr>`).join("");

 $("empty").style.display=entries.length?"none":"block";
 $("count").textContent=entries.length;
 stats();
 renderMonth();
}

function stats(){
 let now=new Date(),today=new Date(now);
 today.setHours(0,0,0,0);

 let week=new Date(today);
 week.setDate(week.getDate()-((week.getDay()+6)%7));

 let t=0,w=0;

 entries.forEach(e=>{
  let d=e.end-e.start-(e.pauseMs||0);
  if(e.start>=today)t+=d;
  if(e.start>=week)w+=d;
 });

 if(active){
  let pause=active.pauseMs||0;
  if(active.pauseStart)pause+=Date.now()-active.pauseStart;
  let d=Date.now()-active.start-pause;
  if(active.start>=today)t+=d;
  if(active.start>=week)w+=d;
 }

 $("today").textContent=dur(Math.max(t,0));
 $("week").textContent=dur(Math.max(w,0));
}

function renderMonth(){
 let y=sel.getFullYear(),m=sel.getMonth(),days={},total=0;

 entries.filter(e=>{
  let d=new Date(e.start);
  return d.getFullYear()==y&&d.getMonth()==m;
 }).forEach(e=>{
  let k=date(e.start);
  let net=e.end-e.start-(e.pauseMs||0);
  days[k]=(days[k]||0)+net;
  total+=net;
 });

 $("month").textContent=sel.toLocaleDateString("de-DE",{month:"long",year:"numeric"});

 $("summary").innerHTML=
 `<div style="font:22px monospace;margin:10px 0">${dur(total)}</div>`+
 Object.entries(days).map(([d,v])=>
  `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2c313b">
   <span>${d}</span><b>${dur(v)}</b>
  </div>`
 ).join("")||
 `<div class="sub">Keine Einträge in diesem Monat.</div>`;
}

function month(n){
 sel.setMonth(sel.getMonth()+n);
 renderMonth();
}

/* ---------- Einzelne Einträge bearbeiten / löschen ---------- */

function openEdit(id){
 let e=entries.find(x=>x.id===id);
 if(!e)return;
 editId=id;

 let s=new Date(e.start), en=new Date(e.end);
 let pad=n=>String(n).padStart(2,"0");

 $("editDate").value=`${s.getFullYear()}-${pad(s.getMonth()+1)}-${pad(s.getDate())}`;
 $("editStart").value=`${pad(s.getHours())}:${pad(s.getMinutes())}`;
 $("editEnd").value=`${pad(en.getHours())}:${pad(en.getMinutes())}`;
 $("editPause").value=Math.round((e.pauseMs||0)/60000);
 $("editNote").value=e.note||"";

 $("editModal").classList.add("show");
}

function closeEdit(){
 $("editModal").classList.remove("show");
 editId=null;
}

function saveEdit(){
 let e=entries.find(x=>x.id===editId);
 if(!e)return;

 let dateVal=$("editDate").value;
 let [sh,sm]=$("editStart").value.split(":").map(Number);
 let [eh,em]=$("editEnd").value.split(":").map(Number);
 let pauseMin=parseInt($("editPause").value)||0;

 if(!dateVal||isNaN(sh)||isNaN(eh)){
  alert("Bitte Datum, Start und Ende ausfüllen.");
  return;
 }

 let [y,mo,d]=dateVal.split("-").map(Number);
 let start=new Date(y,mo-1,d,sh,sm||0).getTime();
 let end=new Date(y,mo-1,d,eh,em||0).getTime();

 if(end<=start){
  alert("Ende muss nach Start liegen.");
  return;
 }

 e.start=start;
 e.end=end;
 e.pauseMs=Math.max(0,pauseMin)*60000;
 e.note=$("editNote").value.trim();

 save();render();closeEdit();
}

function deleteEntry(id){
 if(!confirm("Diesen Eintrag wirklich löschen?"))return;
 entries=entries.filter(e=>e.id!==id);
 save();render();
}

/* ---------- CSV / Backup / Import ---------- */

function csv(){
 if(!entries.length)return alert("Keine Einträge vorhanden.");

 let sorted=[...entries].sort((a,b)=>b.start-a.start);

 let rows=[
  ["Datum","Start","Ende","Dauer","Pause","Notiz"],
  ...sorted.map(e=>[
   date(e.start),time(e.start),time(e.end),
   dur(e.end-e.start-(e.pauseMs||0)),
   e.pauseMs?dur(e.pauseMs):"0h 00m",
   e.note||""
  ])
 ];

 let text="\uFEFF"+rows.map(r=>
  r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")
 ).join("\n");

 download(text,"stempeluhr.csv","text/csv");
}

function backup(){
 download(
  JSON.stringify({entries,active,theme:localStorage.getItem("theme")},null,2),
  "stempeluhr_backup.json",
  "application/json"
 );
 localStorage.setItem("lastBackup",Date.now().toString());
 dismissReminder(false);
}

function validEntries(arr){
 if(!Array.isArray(arr))return false;
 return arr.every(e=>
  e && typeof e==="object" &&
  typeof e.start==="number" && !isNaN(e.start) &&
  typeof e.end==="number" && !isNaN(e.end) &&
  e.end>=e.start
 );
}

function validActive(a){
 if(a===null||a===undefined)return true;
 return typeof a==="object" && typeof a.start==="number" && !isNaN(a.start);
}

function restore(e){
 let f=e.target.files[0];
 if(!f)return;

 let r=new FileReader();

 r.onload=()=>{
  try{
   let x=JSON.parse(r.result);

   if(!validEntries(x.entries)||!validActive(x.active))throw 0;

   let warn="";
   if(active){
    warn="Du bist aktuell eingestempelt seit "+time(active.start)+" Uhr. Diese laufende Sitzung geht beim Import verloren, falls das Backup keine eigene aktive Sitzung enthält. ";
   }
   if(entries.length){
    warn+=`Aktuell vorhanden: ${entries.length} Einträge. Diese werden durch ${x.entries.length} Einträge aus dem Backup ERSETZT.`;
   }
   if(warn && !confirm(warn+"\n\nWirklich fortfahren?")){
    e.target.value="";
    return;
   }

   entries=x.entries.map(en=>({
    id:en.id||(Date.now()+"_"+Math.random().toString(36).slice(2,7)),
    start:en.start,end:en.end,pauseMs:en.pauseMs||0,note:en.note||""
   }));
   active=x.active||null;
   if(active && active.pauseMs===undefined)active.pauseMs=0;

   localStorage.setItem("entries",JSON.stringify(entries));

   if(active)localStorage.setItem("active",JSON.stringify(active));
   else localStorage.removeItem("active");

   if(x.theme)localStorage.setItem("theme",x.theme);

   loadTheme();
   render();
   alert("Backup importiert.");
  }catch{
   alert("Ungültiges Backup: Die Datei enthält keine gültigen Zeiteinträge (start/ende fehlen oder sind fehlerhaft).");
  }
  e.target.value="";
 };

 r.readAsText(f);
}

function download(text,name,type){
 let a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([text],{type}));
 a.download=name;
 a.click();
 URL.revokeObjectURL(a.href);
}

function clearAll(){
 if(confirm("Wirklich alle Einträge löschen?")){
  entries=[];
  save();
  render();
 }
}

function safe(x){
 let d=document.createElement("div");
 d.textContent=x;
 return d.innerHTML;
}

/* ---------- Backup-Reminder ---------- */

function maybeShowReminder(){
 if(!entries.length){$("backupReminder").style.display="none";return;}

 let last=parseInt(localStorage.getItem("lastBackup")||"0");
 let dismissedUntil=parseInt(localStorage.getItem("reminderDismiss")||"0");
 let now=Date.now();
 let sevenDays=7*24*60*60*1000;

 if(now-last>sevenDays && now>dismissedUntil){
  $("reminderText").textContent = last
   ? "Dein letztes Backup ist über 7 Tage her. Alle Daten liegen nur lokal in diesem Browser."
   : "Du hast noch nie ein Backup erstellt. Alle Daten liegen nur lokal in diesem Browser.";
  $("backupReminder").style.display="flex";
 }else{
  $("backupReminder").style.display="none";
 }
}

function dismissReminder(saved){
 if(!saved){
  localStorage.setItem("reminderDismiss",(Date.now()+3*24*60*60*1000).toString());
 }
 $("backupReminder").style.display="none";
}

/* ---------- Theme ---------- */

function theme(){
 document.body.classList.toggle("light");
 localStorage.setItem(
  "theme",
  document.body.classList.contains("light")?"light":"dark"
 );
}

function loadTheme(){
 if(localStorage.getItem("theme")=="light")
  document.body.classList.add("light");
}

$("date").textContent=new Date().toLocaleDateString("de-DE",{
 weekday:"long",day:"2-digit",month:"long",year:"numeric"
});

function tick(){
 if(active){
  let pause=active.pauseMs||0;
  if(active.pauseStart)pause+=Date.now()-active.pauseStart;
  let s=Math.floor((Date.now()-active.start-pause)/1000);
  s=Math.max(s,0);
  $("timer").textContent=
   String(Math.floor(s/3600)).padStart(2,"0")+":"+
   String(Math.floor(s/60)%60).padStart(2,"0")+":"+
   String(s%60).padStart(2,"0");
  stats();
 }
}

/* ---------- Ladebalken ---------- */

function runLoader(){
 let bar=$("loadbar"),msg=$("loadmsg"),loader=$("loader");
 let steps=[
  [0,"Lade Einträge…"],
  [35,"Prüfe aktive Sitzung…"],
  [70,"Baue Monatsübersicht…"],
  [95,"Fast fertig…"]
 ];
 let start=Date.now(),duration=1200;

 function frame(){
  let elapsed=Date.now()-start;
  let pct=Math.min(100,(elapsed/duration)*100);
  bar.style.width=pct+"%";

  let cur=steps[0][1];
  for(const[p,m] of steps) if(pct>=p) cur=m;
  msg.textContent=cur;

  if(elapsed<duration){
   requestAnimationFrame(frame);
  }else{
   loader.style.opacity="0";
   loader.style.transition="opacity .4s";
   setTimeout(()=>loader.remove(),400);
  }
 }
 requestAnimationFrame(frame);
}

loadTheme();
render();
maybeShowReminder();
setInterval(tick,1000);
runLoader();
</script>
</body>
</html>
