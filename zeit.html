<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>Stempeluhr</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:20px;
min-height:100vh;
background:#0e1014;
color:#f5f7fa;
font-family:Arial,sans-serif
}

main{
max-width:850px;
margin:auto
}

.card{
background:#181b21;
border:1px solid #2b3039;
border-radius:16px;
padding:20px;
margin-bottom:15px;
box-shadow:0 10px 35px #0006
}

.hidden{display:none}

h1{margin:0 0 5px;font-size:23px}
h2{font-size:16px}

.sub,small{
color:#8d96a5
}

.logo{
width:42px;
height:42px;
display:grid;
place-items:center;
border-radius:12px;
background:linear-gradient(135deg,#8b5cf6,#5b21b6);
font-size:21px;
margin-bottom:15px
}

input{
width:100%;
padding:13px;
margin:6px 0;
border-radius:10px;
border:1px solid #303641;
background:#22262e;
color:white;
font-size:15px
}

button{
border:0;
border-radius:10px;
padding:12px 16px;
margin:5px 0;
background:#8b5cf6;
color:white;
font-weight:bold;
cursor:pointer
}

button:hover{
filter:brightness(1.1)
}

.red{
background:#a83e3e
}

.gray{
background:#303641
}

.login{
max-width:420px;
margin:70px auto
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:18px
}

.user{
color:#9da5b2
}

.clock{
text-align:center;
padding:35px 20px
}

.status{
color:#9da5b2;
margin-bottom:15px
}

.time{
font-size:70px;
font-family:monospace;
margin:15px 0
}

.punch{
width:260px;
font-size:16px;
padding:15px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:15px
}

.stat{
background:#20242b;
border:1px solid #303641;
border-radius:12px;
padding:16px
}

.stat b{
display:block;
font-size:22px;
font-family:monospace;
margin-top:7px
}

.row{
display:flex;
gap:10px
}

.row>*{
flex:1
}

.table{
overflow-x:auto
}

table{
width:100%;
min-width:600px;
border-collapse:collapse
}

th,td{
padding:11px;
border-bottom:1px solid #303641;
text-align:left
}

th{
font-size:11px;
color:#8d96a5
}

td{
font-family:monospace
}

.note{
font-family:Arial
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap
}

.admin-user{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid #303641
}

.error{
color:#ef6666;
min-height:18px
}

@media(max-width:600px){

body{
padding:10px
}

.card{
padding:16px;
border-radius:13px
}

.login{
margin:30px auto
}

.header{
align-items:flex-start
}

.header button{
width:auto
}

.time{
font-size:43px
}

.punch{
width:100%
}

.stats{
grid-template-columns:1fr 1fr
}

.stats .stat:last-child{
grid-column:1/-1
}

.row{
flex-direction:column
}

table{
font-size:13px
}

}
</style>
</head>

<body>

<main>

<!-- LOGIN -->

<section id="login" class="card login">

<div class="logo">⏱</div>

<h1>Stempeluhr</h1>

<p class="sub">
Arbeitszeit einfach erfassen
</p>

<input
id="username"
placeholder="Benutzername"
autocomplete="username">

<input
id="password"
type="password"
placeholder="Passwort"
autocomplete="current-password">

<button onclick="login()" style="width:100%">
Einloggen
</button>

<p id="error" class="error"></p>

<hr>

<small>
Test-Account:<br>
Benutzername: <b>test</b><br>
Passwort: <b>test1234</b>
</small>

</section>


<!-- APP -->

<section id="app" class="hidden">

<div class="header">

<div>
<h1>⏱ Stempeluhr</h1>
<div id="date" class="sub"></div>
</div>

<div>
<span id="userDisplay" class="user"></span>
<button class="gray" onclick="logout()">
Abmelden
</button>
</div>

</div>


<!-- ADMIN -->

<section id="admin" class="card hidden">

<h2>Benutzerverwaltung</h2>

<div class="row">

<input
id="newUser"
placeholder="Neuer Benutzer">

<input
id="newPassword"
type="password"
placeholder="Passwort">

<button onclick="createUser()">
Erstellen
</button>

</div>

<div id="userList"></div>

</section>


<!-- CLOCK -->

<section class="card clock">

<div id="status" class="status">
🔴 Ausgestempelt
</div>

<div id="timer" class="time">
00:00:00
</div>

<div id="since" class="sub"></div>

<input
id="note"
placeholder="Notiz, z. B. Büro oder Projekt">

<button
id="punchButton"
class="punch"
onclick="punch()">

Einstempeln

</button>

</section>


<!-- STATS -->

<div class="stats">

<div class="stat">
<small>HEUTE</small>
<b id="today">0h 00m</b>
</div>

<div class="stat">
<small>DIESE WOCHE</small>
<b id="week">0h 00m</b>
</div>

<div class="stat">
<small>EINTRÄGE</small>
<b id="count">0</b>
</div>

</div>


<!-- LOG -->

<section class="card">

<div class="header">

<h2>Zeiterfassung</h2>

<div class="actions">

<button onclick="exportCSV()">
CSV Export
</button>

<button class="red" onclick="deleteAll()">
Löschen
</button>

</div>

</div>

<div class="table">

<table>

<thead>

<tr>
<th>Datum</th>
<th>Start</th>
<th>Ende</th>
<th>Dauer</th>
<th>Notiz</th>
</tr>

</thead>

<tbody id="log"></tbody>

</table>

</div>

<p id="empty" class="sub" style="text-align:center">
Noch keine Einträge.
</p>

</section>

</section>

</main>


<script>

let currentUser=null;
let active=null;
let entries=[];

const $=id=>document.getElementById(id);


/* TEST ACCOUNT */

async function setup(){

if(!localStorage.getItem("user:test")){

localStorage.setItem(
"user:test",
JSON.stringify({
password:"test1234",
admin:false
})
);

}

}


/* LOGIN */

function login(){

let user=$("username").value
.trim()
.toLowerCase();

let pass=$("password").value;

let data=localStorage.getItem("user:"+user);

if(!data){

$("error").textContent=
"Benutzername oder Passwort falsch.";

return;

}

let account=JSON.parse(data);

if(account.password!==pass){

$("error").textContent=
"Benutzername oder Passwort falsch.";

return;

}

currentUser=user;

$("login").classList.add("hidden");
$("app").classList.remove("hidden");

$("userDisplay").textContent=
"@"+user+
(account.admin?" • ADMIN":"");

$("date").textContent=
new Date().toLocaleDateString(
"de-DE",
{
weekday:"long",
day:"2-digit",
month:"long",
year:"numeric"
}
);

if(account.admin){

$("admin").classList.remove("hidden");

showUsers();

}

load();

}


/* DATEN LADEN */

function load(){

entries=JSON.parse(
localStorage.getItem(
"entries:"+currentUser
)||"[]"
);

active=JSON.parse(
localStorage.getItem(
"active:"+currentUser
)||"null"
);

render();

}


/* SPEICHERN */

function save(){

localStorage.setItem(
"entries:"+currentUser,
JSON.stringify(entries)
);

if(active){

localStorage.setItem(
"active:"+currentUser,
JSON.stringify(active)
);

}else{

localStorage.removeItem(
"active:"+currentUser
);

}

}


/* EINSTEMPELN */

function punch(){

if(active){

entries.push({

start:active.start,

end:Date.now(),

note:$("note").value.trim()

});

active=null;

}else{

active={

start:Date.now(),

note:$("note").value.trim()

};

}

save();

render();

}


/* ANZEIGE */

function render(){

if(active){

$("status").textContent=
"🟢 Eingestempelt";

$("punchButton").textContent=
"Ausstempeln";

$("punchButton").className=
"punch red";

$("since").textContent=
"Seit "+
formatTime(active.start);

}else{

$("status").textContent=
"🔴 Ausgestempelt";

$("punchButton").textContent=
"Einstempeln";

$("punchButton").className=
"punch";

$("timer").textContent=
"00:00:00";

$("since").textContent="";

}

$("log").innerHTML="";

let sorted=[
...entries
].sort((a,b)=>b.start-a.start);

sorted.forEach(entry=>{

let row=document.createElement("tr");

row.innerHTML=`

<td>
${formatDate(entry.start)}
</td>

<td>
${formatTime(entry.start)}
</td>

<td>
${formatTime(entry.end)}
</td>

<td>
${duration(entry.end-entry.start)}
</td>

<td class="note">
${escapeHTML(entry.note||"-")}
</td>

`;

$("log").appendChild(row);

});

$("empty").style.display=
entries.length?"none":"block";

$("count").textContent=
entries.length;

updateStats();

}


/* ZEIT */

function formatTime(time){

return new Date(time)
.toLocaleTimeString(
"de-DE",
{
hour:"2-digit",
minute:"2-digit"
}
);

}


/* DATUM */

function formatDate(time){

return new Date(time)
.toLocaleDateString(
"de-DE"
);

}


/* DAUER */

function duration(ms){

let minutes=
Math.floor(ms/60000);

let hours=
Math.floor(minutes/60);

minutes=
minutes%60;

return hours+
"h "+
String(minutes)
.padStart(2,"0")+
"m";

}


/* STATISTIK */

function updateStats(){

let today=0;
let week=0;

let now=new Date();

let startToday=new Date(now);

startToday.setHours(
0,0,0,0
);

let monday=new Date(
startToday
);

let day=
(monday.getDay()+6)%7;

monday.setDate(
monday.getDate()-day
);

entries.forEach(entry=>{

let d=
entry.end-entry.start;

if(entry.start>=startToday)
today+=d;

if(entry.start>=monday)
week+=d;

});


if(active){

let d=
Date.now()-active.start;

if(active.start>=startToday)
today+=d;

if(active.start>=monday)
week+=d;

}

$("today").textContent=
duration(today);

$("week").textContent=
duration(week);

}


/* LIVE TIMER */

setInterval(()=>{

if(active){

let ms=
Date.now()-active.start;

let seconds=
Math.floor(ms/1000);

let h=
Math.floor(seconds/3600);

let m=
Math.floor(
(seconds%3600)/60
);

let s=
seconds%60;

$("timer").textContent=

String(h).padStart(2,"0")+
":"+
String(m).padStart(2,"0")+
":"+
String(s).padStart(2,"0");

updateStats();

}

},1000);


/* CSV EXPORT */

function exportCSV(){

if(!entries.length){

alert(
"Keine Zeiteinträge vorhanden."
);

return;

}

let rows=[

[
"Datum",
"Start",
"Ende",
"Dauer",
"Notiz"
]

];

let sorted=[
...entries
].sort((a,b)=>a.start-b.start);

sorted.forEach(entry=>{

rows.push([

formatDate(entry.start),

formatTime(entry.start),

formatTime(entry.end),

duration(
entry.end-entry.start
),

entry.note||""

]);

});


let csv=
"\uFEFF"+
rows.map(row=>
row.map(value=>
'"'+
String(value)
.replace(/"/g,'""')+
'"'
).join(";")
).join("\n");


let blob=
new Blob(
[csv],
{
type:
"text/csv;charset=utf-8"
}
);

let url=
URL.createObjectURL(blob);

let link=
document.createElement("a");

link.href=url;

link.download=
"stempeluhr_"+
currentUser+
".csv";

link.click();

URL.revokeObjectURL(url);

}


/* ALLE EINTRÄGE LÖSCHEN */

function deleteAll(){

if(!confirm(
"Alle Zeiteinträge löschen?"
))return;

entries=[];

save();

render();

}


/* BENUTZER ERSTELLEN */

function createUser(){

let user=
$("newUser").value
.trim()
.toLowerCase();

let password=
$("newPassword").value;

if(!user){

alert(
"Bitte Benutzernamen eingeben."
);

return;

}

if(password.length<6){

alert(
"Das Passwort muss mindestens 6 Zeichen haben."
);

return;

}

if(
localStorage.getItem(
"user:"+user
)
){

alert(
"Dieser Benutzer existiert bereits."
);

return;

}

localStorage.setItem(

"user:"+user,

JSON.stringify({

password:password,

admin:false

})

);

$("newUser").value="";
$("newPassword").value="";

showUsers();

}


/* BENUTZERLISTE */

function showUsers(){

$("userList").innerHTML="";

Object.keys(localStorage)
.filter(key=>
key.startsWith("user:")
)
.forEach(key=>{

let user=
key.substring(5);

let data=
JSON.parse(
localStorage.getItem(key)
);

let div=
document.createElement("div");

div.className=
"admin-user";

div.innerHTML=

"<span>@"+
escapeHTML(user)+
(data.admin?
" • ADMIN":
"")+
"</span>";

if(user!==currentUser){

let button=
document.createElement("button");

button.className="red";

button.textContent=
"Löschen";

button.onclick=()=>{

if(confirm(
"Benutzer "+user+
" wirklich löschen?"
)){

localStorage.removeItem(
"user:"+user
);

localStorage.removeItem(
"entries:"+user
);

localStorage.removeItem(
"active:"+user
);

showUsers();

}

};

div.appendChild(button);

}

$("userList").appendChild(div);

});

}


/* SICHERER TEXT */

function escapeHTML(text){

let div=
document.createElement("div");

div.textContent=text;

return div.innerHTML;

}


/* LOGOUT */

function logout(){

currentUser=null;

active=null;

entries=[];

$("app").classList.add("hidden");

$("login").classList.remove("hidden");

$("username").value="";
$("password").value="";
$("error").textContent="";

}


/* START */

setup();

</script>

</body>
</html>
